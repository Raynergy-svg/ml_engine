# =============================================================================
# IMPROVED Configuration for FX Trading Bot - H1 TIMEFRAME
# =============================================================================
# Optimized for H1 (Hourly) candles - less noise, cleaner patterns
# =============================================================================

# ----- PATH CONFIGURATION -----
paths:
  data_dir: trained_data/data
  model_dir: trained_data/models
  checkpoint_dir: trained_data/checkpoints
  log_dir: trained_data/logs
  cache_dir: trained_data/cache
  viz_dir: trained_data/visualizations
  tensorboard_dir: trained_data/tensorboard

# ----- DEVICE CONFIGURATION FOR M1 METAL -----
device: gpu

# ----- DATA CONFIGURATION -----
data:
  data_dir: market_data/
  cache_dir: trained_data/cache
  required_features:
    - open
    - high
    - low
    - close
    - volume
    - rsi
    - macd
    - macd_signal
    - macd_hist
    - bb_upper_20
    - bb_lower_20
    - bb_width_20
    - bb_position_20
    - atr
    - adx
    - stoch_k
    - stoch_d
    - cci
    - obv
    - mfi
    - williams_r
    - sma_5
    - sma_10
    - sma_20
    - sma_50
    - ema_12
    - ema_26
    - returns
    - volatility_20
    - momentum_10
    - zscore_20
    - roc_5
    - roc_10
    - roc_20

# ----- SEQUENCE CONFIGURATION -----
sequence_length: 60

# ----- H1 DIRECTION LABELING -----
# Look 24 bars ahead (24 hours = 1 day) for cleaner signals on H1
# LOWERED threshold (0.15%) for more balanced signals in low-volatility markets
direction_lookahead: 24
direction_threshold: 0.0015  # Min 0.15% move (was 0.3%, lowered for more balance)

# ----- MODEL CONFIGURATION -----
model:
  type: ensemble
  
  # Feature dimension (will be auto-detected)
  input_size: 192
  
  # Increased capacity for H1 patterns
  hidden_size: 64
  num_layers: 3
  
  # Moderate dropout
  dropout: 0.3
  
  # Keep at 0 for M1 Metal speed
  recurrent_dropout: 0.0
  
  # Kernel regularization (L2)
  kernel_regularizer: 0.001
  
  # TCN-specific (legacy, kept for backward compatibility)
  kernel_size: 3
  use_residual: true
  
  # Multi-task heads
  multi_task: true
  state_classes: 2
  
  # Attention heads
  num_heads: 4

# ----- TRANSFORMER DIRECTION MODEL -----
# Replaces TCN for direction prediction - better at capturing trends
transformer:
  d_model: 32          # Model dimension
  num_heads: 4         # Attention heads  
  num_layers: 2        # Encoder layers
  dff: 64              # Feedforward dimension
  dropout: 0.2         # Dropout rate
  use_transformer: true  # Use Transformer instead of TCN for direction

# ----- OPTIMIZER CONFIGURATION -----
optimizer:
  type: adamw
  
  # Learning rate
  learning_rate: 0.0003
  
  # Weight decay
  weight_decay: 0.01
  
  betas:
    - 0.9
    - 0.999
  
  # Gradient clipping
  clipnorm: 1.0

# ----- TRAINING CONFIGURATION -----
training:
  epochs: 200
  
  # Reduced patience for quick early stopping (save best model fast)
  early_stopping_patience: 10
  
  # Minimum epochs before early stopping
  min_epochs: 60
  
  # M1 optimizations
  jit_compile: false
  run_eagerly: false
  
  # Batch progress
  batch_progress_every: 50

# ----- BATCH SIZE -----
batch_size: 64

# ----- LEARNING RATE SCHEDULE -----
scheduler:
  type: cosine_annealing
  T_max: 50
  eta_min: 0.00001

# ----- LOSS CONFIGURATION -----
loss_type: huber
huber_delta: 1.0

# ----- MULTI-TASK HEAD LOSS WEIGHTS -----
unified_head_loss_weights:
  price: 1.0
  trend: 0.5
  direction: 5.0
  risk: 2.0
  state_logits: 2.0

# ----- FOCAL LOSS FOR DIRECTION -----
auto_focal_alpha: true
focal_gamma: 2.0
direction_loss: focal

# ----- DATA SCALING -----
enable_data_scaling: true
normalize_features: true

# ----- MIXED PRECISION -----
# DISABLED: M1 Metal doesn't support mixed_float16 efficiently
mixed_precision: false

# ----- VALIDATION -----
validation_split: 0.15

# ----- EARLY STOPPING -----
early_stop_monitor: val_loss
early_stopping_patience: 10
min_epochs: 60

# ----- REGULARIZATION -----
noise_std: 0.02
kernel_regularizer: 0.001

# ----- TENSORBOARD -----
tensorboard:
  enabled: true
  log_dir: trained_data/tensorboard
  histogram_freq: 1
  write_graph: true
  write_images: false
  profile_batch: 0
  update_freq: epoch

# ----- FX TRADING CONFIGURATION -----
fx:
  enabled: true
  tier: 1
  timezone: America/New_York
  granularity: H1  # HOURLY TIMEFRAME
  horizon_bars: 1
  equity: 10000.0
  instruments:
    - EUR_USD
    - GBP_USD
    - USD_JPY
  session:
    start: "08:00"
    end: "11:30"
    force_flat_at: "11:55"
    reset_at: "08:00"
  limits:
    max_open_positions: 1
    max_entries_per_day: 1
  risk:
    risk_per_trade_pct: 0.02
    daily_loss_stop_pct: 0.05
    atr_stop_mult: 1.5
    rr_take_profit: 2.0
  execution:
    require_confirmation: true
    practice_only: true
  costs:
    max_spread_pips:
      EUR_USD: 1.0
      GBP_USD: 1.6
      USD_JPY: 1.2
    slippage_pips_min: 0.2
    slippage_pips_spread_mult: 0.25
  confidence:
    low_lt: 0.6
    high_gte: 0.75

# ----- BUDDY CONFIGURATION -----
buddy:
  head_hidden: 64
  head_layers: 3
  head_dropout: 0.2
  dense_hidden: 128
  dense_dropout: 0.3
  
  train_defaults:
    # DATA SETTINGS - Increased for better model training
    default_candles: 15000     # 15k H1 candles = ~625 days (~2 years) - more data for Transformer
    tier2_calibration_stride: 3  # Every 3 H1 candles (3 hours) - appropriate for H1
    tier2_horizon_candles: 48    # 48 H1 candles = 2 days
    seq_len: 60
    epochs: 200
    batch_size: 64
    lr: 0.0003
    patience: 10
    es_monitor: combined
    combined_w_dir: 0.6
    combined_w_conf: 0.4
    steps_per_execution: 10
    shared_encoder: false
    fit_verbose: 2
    mixed_precision: false
    jit_compile: false
    cache_val: true
    no_train_smoothing: true  # CRITICAL: Disable M5 resampling for H1 data
    top_features: 20  # Use only top 20 most important features (prevents overfitting)
    
    # WARM-START / ITERATIVE TRAINING (compounding learning)
    # When true, loads existing checkpoint weights before training
    # This allows iterative improvement: train pair A, then warm-start on pair B
    warm_start: true  # ENABLED: Continue from previous weights for compounding gains
    
    # HISTGB HYBRID VOTING (train HistGradientBoosting alongside Transformer)
    # When both models agree, confidence is higher → better trade quality
    train_histgb: true  # ENABLED: Train HistGB for hybrid voting with Transformer
    
    # REGIME MODEL SETTINGS (replaces direction prediction)
    use_transformer: true      # Use Transformer architecture
    use_regime: false          # Use binary direction prediction (for hybrid voting)
    regime_lookback: 20        # 20 bars to analyze regime
    regime_lookahead: 12       # 12 bars to confirm regime
    # Legacy direction settings (only used if use_regime: false)
    direction_threshold: 0.0015 # Min 0.15% move - LOWERED for more samples & balance
    direction_lookahead: 24     # 24 hours lookahead
  
  # H1 TIMEFRAME TP/SL - WIDER STOPS for hourly candles
  stop_loss_pips: 30.0    # 30 pips SL - appropriate for H1
  take_profit_pips: 60.0  # 60 pips TP - 2:1 RR ratio
  tier2_horizon_candles: 48  # 48 hours = 2 days to hit target
  tier2_spread_fallback_pips: 1.5
  tier2_tie_break: "sl"
  risk_per_trade_pct: 0.01
  
  tier2:
    enabled: true
    p_win_threshold: 0.45
    use_model_confidence_for_gate: true
    remove_confidence_gate: false
    model_conf_threshold: 0.55
    require_both: true
    kelly_fraction: 0.15
    max_risk_per_trade_pct: 0.01
    force_temperature_scaling: true
    require_trending: true
    min_atr_percentile: 0.3

  # ----- TRIPLE BARRIER LABELING -----
  triple_barrier:
    enabled: true
    use_for_direction: true
    exclude_timeouts: false
    timeout_weight: 0.3
    use_best_direction: true
  
  # ----- META-LABELING -----
  meta_labeling:
    enabled: true
    n_estimators: 200
    max_depth: 4
    learning_rate: 0.1
    threshold: 0.55

# ----- XGBOOST BASELINE -----
xgboost:
  enabled: true
  run_baseline_check: true
  n_estimators: 200
  max_depth: 4
  learning_rate: 0.1
  min_child_weight: 3
  gamma: 0.1
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 1.0
  early_stopping_rounds: 50

# ----- MEMORY MONITORING -----
monitoring:
  enable_memory_monitoring: true
  memory_check_interval: 30
  cpu_memory_threshold: 80
  log_memory_usage: true

# ----- PERFORMANCE TARGETS -----
performance:
  max_mse: 0.1
  min_accuracy: 0.55
  min_r2_score: 0.1

# ----- DATA AUGMENTATION -----
augmentation:
  enabled: false
  factor: 2
  noise_level: 0.01
  use_mixup: true
  mixup_alpha: 0.2

# ----- DIAGNOSTIC SETTINGS -----
diagnostics:
  enabled: true
  run_xgboost_baseline: true
  log_gradient_stats: true
  log_feature_importance: true
  save_label_distribution: true

