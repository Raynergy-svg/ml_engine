DATA_DIR: trained_data/data
MODEL_DIR: trained_data/models
LOG_DIR: trained_data/logs
CACHE_DIR: trained_data/cache
VIZ_DIR: trained_data/visualizations
SANDBOX_DIR: sandbox
data_dir: trained_data/data
model_dir: trained_data/models
checkpoint_dir: trained_data/checkpoints
log_dir: trained_data/logs
cache_dir: trained_data/cache
viz_dir: trained_data/visualizations
device: cpu
data:
  data_dir: market_data/
  cache_dir: trained_data/cache
  required_features:
  - open
  - high
  - low
  - close
  - volume
  - rsi
  - macd
  - macd_signal
  - macd_hist
  - bb_upper_20
  - bb_lower_20
  - bb_width_20
  - bb_position_20
  - atr
  - adx
  - stoch_k
  - stoch_d
  - cci
  - obv
  - mfi
  - williams_r
  - sma_5
  - sma_10
  - sma_20
  - sma_50
  - ema_12
  - ema_26
  - returns
  - volatility_20
  - momentum_10
  - zscore_20
  - roc_5
  - roc_10
  - roc_20
  sequence_length: 120
sequence_length: 120
validation_split: 0.1
architecture: attention_lstm
model:
  type: attention_lstm
  input_size: 104
  hidden_size: 48
  num_layers: 3
  dropout: 0.35
  recurrent_dropout: 0.15
  bidirectional: false
  num_heads: 4
  use_flash_attention: true
  state_classes: 2
  optimizer:
    weight_decay: 0.001
optimizer:
  type: adamw
  learning_rate: 0.0003
  weight_decay: 0.001
  betas:
  - 0.9
  - 0.999
scheduler: {}
learning_rate: 0.0005
batch_size: 64
epochs: 200
early_stopping_patience: 15
auto_resume: true
mixed_precision: true
enable_data_scaling: true
training:
  epochs: 200
  early_stopping_patience: 15
loss_type: huber
huber_delta: 1.0
state_classes: 2
unified_head_loss_weights:
  price: 1.0
  trend: 0.5
  risk: 5.0
  state: 7.0
early_stop_patience: 15
min_epochs: 50
monitoring:
  enable_memory_monitoring: true
  memory_check_interval: 60
  cpu_memory_threshold: 85
  log_memory_usage: true
performance:
  max_mse: 0.05
  min_accuracy: 0.7
  min_r2_score: 0.7
normalize_features: true
standardize_features: false
text:
  enabled: true
  text_column: text
  use_hash_ngrams: false
  hash_ngram_dim: 64
  hash_ngram_min: 1
  hash_ngram_max: 2
logging:
  level: INFO
log_file: trained_data/logs/training.log
openai_api_model: gpt-4o
retrain_ticker:
- ORCL
- MSFT
- NVDA
- RIOT
- AAPL
- TSLA
- GOOGL
- AMZN
- FB
- NFLX
risk_management:
  base_position_fraction: 0.02
  min_confidence: 0.5
  max_confidence: 1.0
probabilistic_forecasting: true
fx:
  enabled: true
  tier: 1
  timezone: America/New_York
  granularity: M5
  horizon_bars: 1
  instruments:
  - EUR_USD
  - GBP_USD
  - USD_JPY
  session:
    start: 08:00
    end: '11:30'
    force_flat_at: '11:55'
    reset_at: 08:00
  limits:
    max_open_positions: 1
    max_entries_per_day: 1
  risk:
    risk_per_trade_pct: 0.05
    daily_loss_stop_pct: 0.2
    atr_stop_mult: 1.0
    rr_take_profit: 4.0
  execution:
    require_confirmation: true
    practice_only: true
  costs:
    max_spread_pips:
      EUR_USD: 1.0
      GBP_USD: 1.6
      USD_JPY: 1.2
    slippage_pips_min: 0.2
    slippage_pips_spread_mult: 0.25
    spread_fallback_pips:
      EUR_USD: 1.0
      GBP_USD: 1.6
      USD_JPY: 1.2
  confidence:
    low_lt: 0.6
    high_gte: 0.75
    profit_stop_pct_by_band:
      medium: 0.3
      high: 0.3
  rolling_windows:
  - 3
  - 7
  - 14
  lags:
  - 1
  - 2
  - 3
visualization:
  update_interval: 500
warmup_steps: 1000
weight_decay: 0.001
hidden_size: 32
num_layers: 2
dropout: 0.35
recurrent_dropout: 0.15
kernel_regularizer: 0.001
augmentation_factor: 3

# =============================================================================
# Framework Selection (pytorch or tensorflow)
# =============================================================================
framework: pytorch  # Options: pytorch, tensorflow

# =============================================================================
# TensorFlow-specific settings
# =============================================================================
tensorflow:
  enabled: true
  # Model types: lstm, attention_lstm, transformer, tft, tcn
  model_type: tft  # Temporal Fusion Transformer (recommended for multi-feature)
  mixed_precision: true  # Use float16 for faster training
  xla_compile: false  # XLA JIT compilation (experimental)

# =============================================================================
# TensorBoard Configuration
# =============================================================================
tensorboard:
  enabled: true
  log_dir: trained_data/tensorboard
  histogram_freq: 1  # Log weight histograms every N epochs
  write_graph: true  # Visualize model architecture
  write_images: false  # Log images (not needed for time series)
  profile_batch: 0  # Profile batches for performance (0 = disabled)
  update_freq: epoch  # Log metrics every epoch
  embeddings_freq: 0  # Log embeddings (0 = disabled)
