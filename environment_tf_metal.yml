name: tf-metal
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - tensorflow>=2.16.1,<2.17  # Pin to 2.16.x - TF 2.18 has down_cast crash on macOS
      - tensorflow-metal>=1.1.0,<1.3; sys_platform == 'darwin' and platform_machine == 'arm64'
      - protobuf>=4.23.0,<5.0.0  # Required for TF 2.16+ compatibility
      - -r requirements_tf_metal.txt
