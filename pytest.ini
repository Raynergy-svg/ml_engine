[pytest]
# Keep CI/dev runs usable: exclude archived/experimental folders and
# ignore known broken legacy tests.
#
# You can still run any individual test file explicitly.

testpaths = tests
norecursedirs =
    .venv
    __pycache__
    (redacted) future_use

markers =
    bias_fixes: tests for overfitting/bias plan fixes (Fix #1-5)
    slow: marks tests as slow (deselect with '-m "not slow"')

addopts =
    --ignore=test_improvements.py
    --ignore=tests/test_data_processing.py
    --ignore=tests/test_integration.py
    --ignore=tests/test_mock_integration.py
    --ignore=tests/test_models_improved.py
    --ignore=tests/test_optimized_model.py
