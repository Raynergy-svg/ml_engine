# =============================================================================
# M1 Metal-Optimized Configuration for FX Trading Bot
# =============================================================================
# This configuration is specifically tuned for Apple M1 chips with TensorFlow Metal
# Addresses: slow training, poor convergence, and "guessing" behavior
# =============================================================================

# ----- PATH CONFIGURATION -----
paths:
  data_dir: trained_data/data
  model_dir: trained_data/models
  checkpoint_dir: trained_data/checkpoints
  log_dir: trained_data/logs
  cache_dir: trained_data/cache
  viz_dir: trained_data/visualizations
  tensorboard_dir: trained_data/tensorboard

# ----- DEVICE CONFIGURATION FOR M1 METAL -----
device: gpu  # TF-Metal will use this

# ----- DATA CONFIGURATION -----
data:
  data_dir: market_data/
  cache_dir: trained_data/cache
  required_features:
    - open
    - high
    - low
    - close
    - volume
    - rsi
    - macd
    - macd_signal
    - macd_hist
    - bb_upper_20
    - bb_lower_20
    - bb_width_20
    - bb_position_20
    - atr
    - adx
    - stoch_k
    - stoch_d
    - cci
    - obv
    - mfi
    - williams_r
    - sma_5
    - sma_10
    - sma_20
    - sma_50
    - ema_12
    - ema_26
    - returns
    - volatility_20
    - momentum_10
    - zscore_20
    - roc_5
    - roc_10
    - roc_20

# ----- SEQUENCE CONFIGURATION -----
# IMPORTANT: Reduced from 120 to 60 for M1 performance
# Longer sequences = more memory + slower training
sequence_length: 60

# ----- DIRECTION LABELING -----
# H4 Strategy: Look further ahead for cleaner signals
direction_lookahead: 12  # Look 12 bars ahead (2 days on H4, 12 hours on H1)
direction_threshold: 0.001  # Min 0.1% move to count as directional (reduced from 0.2% for more samples)

# ----- TARGET PREDICTION HORIZON -----
# CRITICAL: Predicting 1 candle ahead is essentially noise prediction
# Increase to 12-24 for H1 data (12-24 hours ahead) for learnable signals
target_shift: 12  # Predict 12 candles ahead - aligns with direction_lookahead

# ----- MODEL CONFIGURATION -----
model:
  # TCN is 2-3x FASTER than TFT/LSTM on M1 with similar accuracy
  type: ensemble   # Options: tcn, attention_lstm, tft
  
  # Feature dimension (will be auto-detected from data)
  input_size: 104
  
  # REDUCED: From 48 to 32 for better generalization on small datasets
  hidden_size: 32
  
  # REDUCED: From 3 to 2 layers to prevent overfitting
  num_layers: 2
  
  # INCREASED: From 0.35 to 0.4 for stronger regularization
  dropout: 0.4
  
  # DISABLED: RecurrentDropout causes massive slowdown on Metal
  # Instead, we use GaussianNoise + SpatialDropout1D
  recurrent_dropout: 0.0  # CRITICAL: Keep at 0 for M1 Metal speed
  
  # Kernel regularization (L2)
  kernel_regularizer: 0.002
  
  # TCN-specific
  kernel_size: 3
  use_residual: true
  
  # Multi-task heads
  multi_task: true
  state_classes: 2  # Binary: high/low volatility
  
  # Attention heads (for attention_lstm)
  num_heads: 4

# ----- OPTIMIZER CONFIGURATION -----
optimizer:
  # Use native AdamW (not legacy) - better M1 Metal support
  type: adamw
  
  # AUTO-TUNED: Best from hyperparameter search (52.34% accuracy)
  learning_rate: 0.0001
  
  # INCREASED: From 0.001 to 0.01 for stronger regularization
  weight_decay: 0.01
  
  betas:
    - 0.9
    - 0.999
  
  # Gradient clipping for stability
  clipnorm: 1.0

# ----- TRAINING CONFIGURATION -----
training:
  epochs: 200
  
  # AUTO-TUNED: Best from hyperparameter search (52.34% accuracy)
  early_stopping_patience: 15
  
  # NEW: Don't stop before this epoch (let model warm up)
  min_epochs: 30
  
  # NEW: Enable XLA JIT compilation for M1 speed boost
  jit_compile: false  # Set to true if TF >= 2.13
  
  # NEW: Run eagerly only for debugging
  run_eagerly: false
  
  # Batch progress logging (helps see if training is stuck)
  batch_progress_every: 50
  
  # RL Position Sizer: Automatically train RL agent after ensemble training
  # Set to false to disable automatic RL training (can still train manually with train-rl-sizer)
  auto_train_rl: true
  rl_timesteps: 500000  # RL training timesteps (500k ~ 10-15 min on M1)

# ----- BATCH SIZE (CRITICAL FOR M1 PERFORMANCE) -----
# AUTO-TUNED: Best from hyperparameter search (52.34% accuracy)
# M1 Pro/Max: Use 128-256
# M1 base: Use 64-128
batch_size: 64

# ----- LEARNING RATE SCHEDULE -----
scheduler:
  # Cosine annealing with warm restarts
  type: cosine_annealing
  T_max: 50  # Restart every 50 epochs
  eta_min: 0.00001  # Minimum LR

# ----- LOSS CONFIGURATION -----
loss_type: huber
huber_delta: 1.0

# ----- MULTI-TASK HEAD LOSS WEIGHTS -----
# INCREASED: Direction weight to force the model to learn it
unified_head_loss_weights:
  price: 1.0       # Primary target
  trend: 0.5       # Secondary
  direction: 15.0  # INCREASED from 5.0 - force direction learning
  risk: 2.0        # Risk prediction
  state_logits: 3.0  # renamed from 'state'

# ----- FOCAL LOSS FOR DIRECTION -----
# Auto-tune based on class imbalance
auto_focal_alpha: true
focal_gamma: 2.0
direction_loss: focal  # Options: focal, bce

# ----- LABEL SMOOTHING (Quick Win #2) -----
# Prevents overconfidence, improves generalization
label_smoothing: 0.1  # For direction head (soft targets: 0.1/0.9 instead of 0/1)
state_label_smoothing: 0.05  # For state classification

# ----- MODEL EMA (Quick Win #4) -----
# Exponential moving average of weights for smoother inference
use_model_ema: true
ema_decay: 0.999  # Higher = smoother but slower adaptation

# ----- WARM RESTART LR SCHEDULE (Medium Effort #2) -----
# Cosine annealing with warm restarts for escaping local minima
# Paper: "SGDR: Stochastic Gradient Descent with Warm Restarts"
lr_schedule:
  type: "cosine_restarts"  # Options: "cosine_restarts", "warmup_cosine", "exponential"
  initial_lr: 0.001
  first_decay_epochs: 10  # T_0: First cycle length in epochs
  t_mul: 2.0  # T_mult: Each cycle is t_mul times longer (10, 20, 40, 80...)
  m_mul: 0.9  # LR decay per cycle (0.9 = 10% decay each restart)
  alpha: 0.01  # Minimum LR as fraction of initial
  warmup_epochs: 2  # Linear warmup at start

# ----- DATA SCALING -----
enable_data_scaling: true
normalize_features: true

# ----- MIXED PRECISION (CRITICAL FOR M1 SPEED) -----
# Enable for 1.5-2x speedup on M1
mixed_precision: true

# ----- VALIDATION -----
validation_split: 0.15

# ----- PURGE GAP (PREVENT TEMPORAL LEAKAGE) -----
# Number of samples to skip between train and validation sets
# This prevents information leakage through rolling features
# Recommended: at least sequence_length (60 by default)
purge_gap: 60

# ----- EARLY STOPPING MONITOR -----
# Changed from direction to val_loss for stability
early_stop_monitor: val_loss
early_stopping_patience: 30
min_epochs: 30

# ----- REGULARIZATION (PREVENT OVERFITTING) -----
# GaussianNoise injected at input
noise_std: 0.03

# L2 regularization
kernel_regularizer: 0.002

# ----- OVERFIT PREVENTION -----
# Controls the OverfitPreventionCallback that monitors train-val gap
overfit_prevention:
  overfit_threshold: 0.08       # 8% train-val gap triggers warning
  critical_threshold: 0.15      # 15% gap triggers LR reduction
  severe_threshold: 0.25        # 25% gap triggers early stop
  max_acceptable_gap: 0.12      # Won't save checkpoint if gap > 12%
  patience_epochs: 3            # Consecutive overfit epochs before intervention
  auto_adjust_dropout: true     # Dynamically increase dropout on overfitting
  auto_reduce_lr: true          # Dynamically reduce LR on overfitting
  max_dropout_increase: 0.3     # Cap on dropout increase

# ----- STOCHASTIC WEIGHT AVERAGING (SWA) -----
# Averages weights in final portion of training for flatter optima
swa:
  enabled: true                 # Enable SWA
  start_fraction: 0.75          # Start at 75% of training
  lr_factor: 0.5                # SWA constant LR = initial_lr * factor

# ----- COSINE ANNEALING WITH WARM RESTARTS -----
# Periodically resets LR to escape sharp local minima
cosine_restarts:
  enabled: true                 # Enable cosine annealing w/ warm restarts
  restart_period: 10            # Restart every N epochs
  lr_mult: 0.8                  # Each restart uses 80% of prev LR

# ----- WARM-START OVERFIT RECOVERY -----
warmstart_recovery:
  enabled: true                 # Detect/recover from warm-start overfitting
  reset_threshold: 0.15         # If initial gap > 15%, intervene
  weight_perturbation_scale: 0.02  # Noise to break memorization
  reset_optimizer_on_overfit: true # Reset optimizer momentum on critical overfit

# ----- TENSORBOARD -----
tensorboard:
  enabled: true
  log_dir: trained_data/tensorboard
  histogram_freq: 1
  write_graph: true
  write_images: false
  profile_batch: 0  # Set to 2 to profile second batch
  update_freq: epoch

# ----- FX TRADING CONFIGURATION -----
fx:
  enabled: true
  tier: 1
  timezone: America/New_York
  granularity: M5
  horizon_bars: 1
  # equity: fetched from OANDA live account (compounding)
  instruments:
    - EUR_USD
    - GBP_USD
    - USD_JPY
  session:
    start: "08:00"
    end: "11:30"
    force_flat_at: "11:55"
    reset_at: "08:00"
  limits:
    max_open_positions: 5  # Allow multiple positions for diversification
    max_entries_per_day: 30  # Professional: up to 30 trades/day
  risk:
    risk_per_trade_pct: 0.05  # 5% risk per trade (~$5k on $100k account)
    daily_loss_stop_pct: 0.15  # 15% daily stop (allows 3 full losses)
    atr_stop_mult: 1.5
    rr_take_profit: 2.0
  execution:
    require_confirmation: true
    practice_only: true
  costs:
    max_spread_pips:
      EUR_USD: 1.0
      GBP_USD: 1.6
      USD_JPY: 1.2
    slippage_pips_min: 0.2
    slippage_pips_spread_mult: 0.25
  confidence:
    low_lt: 0.6      # RAISED from 0.7 - minimum threshold
    high_gte: 0.75   # LOWERED from 0.8 - easier to reach

# ----- BUDDY CONFIGURATION -----
buddy:
  head_hidden: 64
  head_layers: 3  # INCREASED from 2 for TCN (more layers = larger receptive field)
  head_dropout: 0.2  # INCREASED from 0.1
  dense_hidden: 128
  dense_dropout: 0.3  # INCREASED from 0.2
  
  train_defaults:
    tier2_calibration_stride: 10
    tier2_horizon_candles: 60
    seq_len: 60  # Reduced from 50 to match sequence_length
    epochs: 100
    batch_size: 64  # AUTO-TUNED: Best from hyperparameter search
    lr: 0.0001      # AUTO-TUNED: Best from hyperparameter search
    patience: 15    # AUTO-TUNED: Best from hyperparameter search
    es_monitor: combined  # CHANGED: Optimize for combined score (direction + confidence)
    combined_w_dir: 0.5   # BALANCED - both matter
    combined_w_conf: 0.5  # BALANCED - confidence is critical for risk management
    steps_per_execution: 10  # Reduced for stability
    shared_encoder: false  # Set to false when using model.type: tcn
    fit_verbose: 2
    # M1 METAL CRITICAL SETTINGS
    mixed_precision: true   # 1.5-2x speedup on M1
    jit_compile: false      # Keep false for stability
    cache_val: true         # Cache validation data in memory
  
  # H4 Strategy: Wider stops for larger timeframe moves
  # SL=30, TP=60 = 2:1 RR, need 33.3% win rate to break even
  stop_loss_pips: 30.0   # Wider stop for H4 (reduced noise)
  take_profit_pips: 60.0 # 2:1 RR maintained
  tier2_horizon_candles: 30  # 30 H4 candles = 5 days (enough time for TP/SL)
  tier2_spread_fallback_pips: 2.0
  tier2_tie_break: "sl"
  risk_per_trade_pct: 0.01  # Conservative
  
  tier2:
    enabled: true
    # STRICT GATING - only trade high-confidence setups
    p_win_threshold: 0.45   # Accept trades with 45%+ calibrated win probability
    use_model_confidence_for_gate: true
    remove_confidence_gate: false
    model_conf_threshold: 0.55   # Model must be 55%+ confident
    require_both: true    # CHANGED: Require BOTH conditions (stricter)
    kelly_fraction: 0.15   # REDUCED - more conservative sizing
    max_risk_per_trade_pct: 0.01
    force_temperature_scaling: true  # Force-enable temperature scaling
    
    # NEW: Regime filters (only trade in favorable conditions)
    require_trending: true     # Only trade when ADX > 25
    min_atr_percentile: 0.3    # Avoid low-volatility periods

  # ----- TRIPLE BARRIER LABELING -----
  # Enhanced labeling based on actual trade outcomes (Lopez de Prado method)
  triple_barrier:
    enabled: true
    use_for_direction: true      # Use triple barrier outcomes for direction labels
    exclude_timeouts: false      # Keep timeout samples but downweight them
    timeout_weight: 0.3          # Weight for timeout samples (unclear signal)
    use_best_direction: true     # At each point, pick direction with best outcome
  
  # ----- META-LABELING -----
  # Secondary model that predicts when to trust primary model's signals
  # Key insight: Don't try to predict direction better, learn WHEN to trade
  meta_labeling:
    enabled: true
    n_estimators: 200
    max_depth: 4
    learning_rate: 0.1
    threshold: 0.55              # Only trade when meta-confidence >= threshold

# ----- XGBOOST CONFIGURATION -----
# Alternative model type: gradient boosting often outperforms DL on tabular data
xgboost:
  enabled: true
  n_estimators: 500
  max_depth: 6
  learning_rate: 0.05
  min_child_weight: 3
  gamma: 0.1
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1    # L1 regularization
  reg_lambda: 1.0   # L2 regularization
  early_stopping_rounds: 50

# ----- MEMORY MONITORING -----
monitoring:
  enable_memory_monitoring: true
  memory_check_interval: 30
  cpu_memory_threshold: 80
  log_memory_usage: true

# ----- PERFORMANCE TARGETS -----
performance:
  max_mse: 0.1
  min_accuracy: 0.55  # LOWERED from 0.7 - more realistic
  min_r2_score: 0.1   # LOWERED from 0.7 - price prediction is hard

# ----- DATA AUGMENTATION -----
augmentation:
  enabled: true
  factor: 2
  noise_level: 0.01
  use_mixup: true
  mixup_alpha: 0.2

