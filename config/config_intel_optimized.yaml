paths:
  data_dir: trained_data/data
  model_dir: trained_data/models
  checkpoint_dir: trained_data/checkpoints
  log_dir: trained_data/logs
  cache_dir: trained_data/cache
  viz_dir: trained_data/visualizations
  tensorboard_dir: trained_data/tensorboard
device: cpu
data:
  data_dir: market_data/
  cache_dir: trained_data/cache
  required_features:
  - open
  - high
  - low
  - close
  - volume
  - rsi
  - macd
  - macd_signal
  - macd_hist
  - bb_upper_20
  - bb_lower_20
  - bb_width_20
  - bb_position_20
  - atr
  - adx
  - stoch_k
  - stoch_d
  - cci
  - obv
  - mfi
  - williams_r
  - sma_5
  - sma_10
  - sma_20
  - sma_50
  - ema_12
  - ema_26
  - returns
  - volatility_20
  - momentum_10
  - zscore_20
  - roc_5
  - roc_10
  - roc_20
sequence_length: 60
direction_lookahead: 24
direction_threshold: 0.005
model:
  type: ensemble
  input_size: 192
  hidden_size: 64
  num_layers: 3
  dropout: 0.6
  recurrent_dropout: 0.25
  kernel_regularizer: 0.01
  kernel_size: 3
  use_residual: true
  multi_task: true
  state_classes: 4
  num_heads: 4
transformer:
  d_model: 48
  num_heads: 4
  num_layers: 3
  dff: 96
  dropout: 0.35
  dense_dropout: 0.3
  use_transformer: true
tcn_regime:
  enabled: true
  kernel_size: 5
  num_filters: 64
  num_residual_blocks: 5
  dilation_base: 2
  dropout: 0.3
  dense_dropout: 0.35
  weight_norm: true
  use_residual: true
  kernel_regularizer: 0.001
  activity_regularizer: 0.0
  label_smoothing: 0.1
  learning_rate: 0.0005
  batch_size: 32
  epochs: 150
  early_stopping_patience: 30
  early_stopping_min_delta: 0.001
  min_epochs: 50
  use_class_weights: true
  class_weight_method: balanced
  manual_class_weights:
    0: 1.0
    1: 1.0
    2: 2.0
    3: 4.0
  atr_window: 14
  percentile_low: 20
  percentile_normal: 45
  percentile_high: 70
  success_criteria:
    min_accuracy: 0.75
    min_f1_minority: 0.7
    min_high_extreme_recall: 0.8
optimizer:
  type: adamw
  learning_rate: 0.0003
  weight_decay: 0.0001
  betas:
  - 0.9
  - 0.999
  clipnorm: 1.0
feature_selection:
  enabled: true
  method: random_forest
  top_k_features: 100
  min_importance_threshold: 0.001
training:
  epochs: 200
  early_stopping_patience: 20
  early_stopping_min_delta: 0.0005
  min_epochs: 60
  label_smoothing: 0.1
  jit_compile: false
  run_eagerly: false
  batch_progress_every: 50
  workers: 4
  use_multiprocessing: true
  use_hybrid_sft_rl: true
  rl_prob: 0.5
  entropy_coef: 0.01
  initial_baseline: 0.5
  baseline_momentum: 0.9
batch_size: 32
scheduler:
  type: cosine_annealing
  T_max: 50
  eta_min: 1.0e-05
loss_type: huber
huber_delta: 1.0
unified_head_loss_weights:
  price: 1.0
  trend: 0.5
  direction: 5.0
  risk: 2.0
  state_logits: 2.0
auto_focal_alpha: true
focal_gamma: 2.0
direction_loss: focal
enable_data_scaling: true
normalize_features: true
mixed_precision: false
validation_split: 0.15
early_stop_monitor: val_loss
early_stopping_patience: 40
min_epochs: 60
noise_std: 0.02
kernel_regularizer: 0.001
overfit_prevention:
  overfit_threshold: 0.08
  critical_threshold: 0.15
  severe_threshold: 0.25
  max_acceptable_gap: 0.12
  patience_epochs: 3
  auto_adjust_dropout: true
  auto_reduce_lr: true
  max_dropout_increase: 0.3
swa:
  enabled: true
  start_fraction: 0.75
  lr_factor: 0.5
cosine_restarts:
  enabled: true
  restart_period: 10
  lr_mult: 0.8
warmstart_recovery:
  enabled: true
  reset_threshold: 0.15
  weight_perturbation_scale: 0.02
  reset_optimizer_on_overfit: true
tensorboard:
  enabled: true
  log_dir: trained_data/tensorboard
  histogram_freq: 1
  write_graph: true
  write_images: false
  profile_batch: 0
  update_freq: epoch
fx:
  enabled: true
  tier: 1
  timezone: America/New_York
  granularity: H1
  horizon_bars: 1
  equity: 10000.0
  instruments:
  - EUR_USD
  - GBP_USD
  - USD_JPY
  session:
    start: 08:00
    end: '11:30'
    force_flat_at: '11:55'
    reset_at: 08:00
  limits:
    max_open_positions: 1
    max_entries_per_day: 1
  risk:
    risk_per_trade_pct: 0.02
    daily_loss_stop_pct: 0.05
    atr_stop_mult: 1.5
    rr_take_profit: 2.0
  execution:
    require_confirmation: true
    practice_only: true
  costs:
    max_spread_pips:
      EUR_USD: 1.0
      GBP_USD: 1.6
      USD_JPY: 1.2
    slippage_pips_min: 0.2
    slippage_pips_spread_mult: 0.25
  confidence:
    low_lt: 0.6
    high_gte: 0.75
buddy:
  head_hidden: 64
  head_layers: 3
  head_dropout: 0.3
  dense_hidden: 128
  dense_dropout: 0.35
  train_defaults:
    default_candles: 15000
    tier2_calibration_stride: 3
    tier2_horizon_candles: 48
    seq_len: 60
    epochs: 200
    batch_size: 32
    lr: 0.0003
    patience: 40
    es_monitor: combined
    combined_w_dir: 0.6
    combined_w_conf: 0.4
    steps_per_execution: 10
    shared_encoder: false
    fit_verbose: 2
    mixed_precision: false
    jit_compile: false
    cache_val: true
    no_train_smoothing: true
    workers: 4
    use_transformer: true
    use_regime: true
    regime_lookback: 20
    regime_lookahead: 12
    direction_threshold: 0.003
    direction_lookahead: 24
  stop_loss_pips: 15.0
  take_profit_pips: 30.0
  tier2_horizon_candles: 24
  tier2_spread_fallback_pips: 1.5
  tier2_tie_break: sl
  risk_per_trade_pct: 0.02
  tier2:
    enabled: true
    p_win_threshold: 0.45
    use_model_confidence_for_gate: true
    remove_confidence_gate: false
    model_conf_threshold: 0.55
    require_both: true
    kelly_fraction: 0.15
    max_risk_per_trade_pct: 0.01
    force_temperature_scaling: true
    require_trending: true
    min_atr_percentile: 0.3
  triple_barrier:
    enabled: true
    use_for_direction: true
    exclude_timeouts: false
    timeout_weight: 0.3
    use_best_direction: true
  meta_labeling:
    enabled: true
    n_estimators: 200
    max_depth: 4
    learning_rate: 0.1
    threshold: 0.55
xgboost:
  enabled: true
  run_baseline_check: true
  n_estimators: 200
  max_depth: 4
  learning_rate: 0.1
  min_child_weight: 3
  gamma: 0.1
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 1.0
  early_stopping_rounds: 50
