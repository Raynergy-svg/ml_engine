  enabled: true
  factor: 2
  noise_level: 0.01
  time_series:
    enabled: true
    augment_prob: 0.5
    jittering:
      enabled: true
      noise_std_min: 0.01
      noise_std_max: 0.05
      apply_prob: 0.5
    scaling:
      enabled: true
      scale_min: 0.95
      scale_max: 1.05
      apply_prob: 0.5
  use_mixup: true
  mixup_alpha: 0.2
