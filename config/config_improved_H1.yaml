reproducibility:
  enabled: true
  global_seed: 42
paths:
  data_dir: trained_data/data
  model_dir: trained_data/models
  checkpoint_dir: trained_data/checkpoints
  log_dir: trained_data/logs
  cache_dir: trained_data/cache
  viz_dir: trained_data/visualizations
  tensorboard_dir: trained_data/tensorboard
device: gpu
data:
  data_dir: market_data/
  cache_dir: trained_data/cache
  required_features:
  - open
  - high
  - low
  - close
  - volume
  - rsi
  - macd
  - macd_signal
  - macd_hist
  - bb_upper_20
  - bb_lower_20
  - bb_width_20
  - bb_position_20
  - atr
  - adx
  - stoch_k
  - stoch_d
  - cci
  - obv
  - mfi
  - williams_r
  - sma_5
  - sma_10
  - sma_20
  - sma_50
  - ema_12
  - ema_26
  - returns
  - volatility_20
  - momentum_10
  - zscore_20
  - roc_5
  - roc_10
  - roc_20
sequence_length: 60
direction_lookahead: 24
direction_threshold: 0.0075
use_feature_selection: true
feature_selection_method: random_forest
top_k_features: 50
model:
  type: ensemble
  input_size: 192
  hidden_size: 64
  num_layers: 3
  dropout: 0.3
  recurrent_dropout: 0.0
  kernel_regularizer: 0.001
  tcn_hidden_size: 16
  tcn_num_layers: 1
  tcn_kernel_size: 2
  tcn_dropout: 0.6
  tcn_l2_reg: 0.01
  tcn_spatial_dropout: 0.3
  tcn_noise_std: 0.05
  use_residual: false
  multi_task: true
  state_classes: 4
  num_heads: 4
ensemble:
  enabled: true
  method: voting
  n_models: 3
  weights: auto
  bootstrap: true
  aggregation: soft
transformer:
  d_model: 32
  num_heads: 4
  num_layers: 2
  dff: 64
  dropout: 0.2
  label_smoothing: 0.05
  l2_reg: 0.003
  input_noise: 0.02
  spatial_dropout: 0.1
  projection_dropout: 0.1
  head_dropout: 0.1
  use_augmentation: true
  augmentation_noise_std: 0.01
  augmentation_scale_range:
  - 0.98
  - 1.02
  augmentation_time_mask_prob: 0.1
  augmentation_time_mask_max_len: 5
  use_transformer: true
use_tcn_volatility_filter: true
transformer_weight: 1.0
volatility_regime:
  lookback_bars: 100
  thresholds:
  - 0.25
  - 0.6
  - 0.85
  min_regime_for_trade: 0
  tcn_required: false
optimizer:
  type: adamw
  learning_rate: 0.0001
  weight_decay: 0.001
  betas:
  - 0.9
  - 0.999
  clipnorm: 0.5
training:
  epochs: 300
  use_ensemble: true
  early_stopping_patience: 40
  min_epochs: 60
  warmup_epochs: 5
  auto_train_rl: false
  warm_start_lr_factor: 0.3
  warm_start_unfreeze_epochs: 5
  warm_start_gradual_unfreeze: true
  warm_start_freeze_encoder: false
  warm_start_encoder_layers_to_freeze: 2
  warm_start_gradual_unfreeze_strategy: true
  max_overfit_gap: 0.15
  jit_compile: false
  run_eagerly: false
  batch_progress_every: 50
rl_integration:
  enabled: false
  auto_train_after_ensemble: false
  position_sizing:
    enabled: true
    model_path: trained_data/models/rl_position_sizer.zip
    scaler_path: trained_data/models/rl_scaler.pkl
    timesteps: 50000
    learning_rate: 0.0003
    n_steps: 256
    batch_size: 32
    n_epochs: 5
    gamma: 0.99
    gae_lambda: 0.95
    sequence_length: 60
    max_position_pct: 0.1
    min_position_pct: 0.01
    sharpe_weight: 0.1
    drawdown_penalty: 0.5
    win_rate_bonus: 0.2
    max_drawdown_pct: 0.1
    daily_loss_limit_pct: 0.03
    fallback_pct: 0.01
  gate_optimization:
    enabled: false
    model_path: trained_data/models/sac_gate_thresholds.zip
    timesteps: 100000
    learning_rate: 0.0003
    buffer_size: 100000
    batch_size: 256
    confidence_bounds:
    - 0.5
    - 0.8
    momentum_bounds:
    - 0.1
    - 0.5
    risk_bounds:
    - 0.01
    - 0.05
    meta_bounds:
    - 0.5
    - 0.7
    default_thresholds:
      confidence: 0.6
      momentum: 0.2
      risk: 0.025
      meta: 0.55
  exit_timing:
    enabled: false
    model_path: trained_data/models/ppo_optimal_exit.zip
    timesteps: 100000
    learning_rate: 0.0003
    hold_action: 0
    take_profit_action: 1
    stop_loss_action: 2
    min_profit_for_tp: 0.002
    max_loss_for_sl: -0.003
    max_bars_held: 24
  reward_model:
    enabled: false
    use_ensemble_predictions: true
    include_risk_metrics: true
    reward_horizon_bars: 24
    normalize_rewards: true
    weight_in_env: 0.3
  inference:
    position_size_source: rl
    threshold_adaptation_weight: 0.5
    exit_timing_confidence: 0.7
    fallback_on_error: true
    log_rl_decisions: true
batch_size: 64
scheduler:
  type: cosine_annealing
  T_max: 50
  eta_min: 1.0e-05
lr_schedule:
  type: cosine_restarts
  first_decay_epochs: 15
  t_mul: 2.0
  m_mul: 0.9
  warmup_epochs: 5
  alpha: 0.01
loss_type: huber
huber_delta: 1.0
unified_head_loss_weights:
  price: 1.0
  trend: 0.5
  direction: 5.0
  risk: 2.0
  state_logits: 2.0
use_focal_loss: true
auto_focal_alpha: true
focal_gamma: 2.0
direction_loss: focal
use_hybrid_cb_anticollapse: true
use_class_balanced_loss: true
cb_beta: 0.9999
cb_gamma: 2.0
use_anti_collapse_loss: true
anti_collapse_base_variance_weight: 0.2
anti_collapse_label_smoothing: 0.05
sample_weight_max_multiplier: 5.0
enable_data_scaling: true
normalize_features: true
mixed_precision: false
validation_split: 0.15
early_stop_monitor: val_loss
early_stopping_patience: 40
min_epochs: 60
noise_std: 0.02
kernel_regularizer: 0.001
inference:
  min_tcn_probability: 0.6
  min_confidence: 50.0
  min_momentum: 0.2
  require_fresh_or_accel: true
  max_drawdown_pct: 0.025
  max_streak_prob: 0.95
  enable_meta_labeling: true
  min_meta_confidence: 0.55
  sentiment_block_enabled: true
  sentiment_block_threshold: 0.6
  sentiment_min_headlines: 3
  permissive_mode: false
  bypass_risk_gate_in_permissive: false
  enable_calibration: true
  calibration_method: platt
  by_pair:
    AUD_NZD:
      sentiment_block_enabled: true
      sentiment_block_directions:
      - short
    EUR_AUD:
      sentiment_block_enabled: true
      sentiment_block_directions:
      - long
    GBP_AUD:
      sentiment_block_enabled: true
      sentiment_block_directions:
      - long
news:
  enabled: true
  source: rss
  max_headlines: 10
  sentiment_model: finbert
walkforward:
  enabled: true
  mode: rolling
  n_splits: 5
  train_size: 0.6
  val_size: 0.1
  test_size: 0.1
  gap: 24
  min_train_size: 2000
  use_purged_kfold: true
  purge_gap: 24
  embargo_gap: 12
  retrain_per_fold: true
  aggregate_method: best
  ensure_regime_balance: false
  min_samples_per_regime: 50
tensorboard:
  enabled: true
  log_dir: trained_data/tensorboard
  histogram_freq: 1
  write_graph: true
  write_images: false
  profile_batch: 0
  update_freq: epoch
fx:
  enabled: true
  tier: 1
  timezone: America/New_York
  granularity: H1
  horizon_bars: 1
  equity: 10000.0
  instruments:
  - EUR_USD
  - GBP_USD
  - USD_JPY
  session:
    start: 08:00
    end: '11:30'
    force_flat_at: '11:55'
    reset_at: 08:00
  limits:
    max_open_positions: 1
    max_entries_per_day: 1
  risk:
    risk_per_trade_pct: 0.02
    daily_loss_stop_pct: 0.05
    atr_stop_mult: 1.5
    rr_take_profit: 2.0
  execution:
    require_confirmation: true
    practice_only: true
  costs:
    max_spread_pips:
      EUR_USD: 1.0
      GBP_USD: 1.6
      USD_JPY: 1.2
    slippage_pips_min: 0.2
    slippage_pips_spread_mult: 0.25
  confidence:
    low_lt: 0.6
    high_gte: 0.75
regime:
  enabled: true
  num_classes: 5
  thresholds:
    adx_strong_trend: 40
    adx_weak_trend: 25
    adx_chop: 20
    adx_breakout_max: 30
    rsi_extreme_low: 30
    rsi_extreme_high: 70
    atr_expansion_ratio: 1.3
    adx_rise_threshold: 2
  transition:
    cooldown_bars: 3
    min_confidence: 0.6
    confirm_bars: 2
  behavior:
    STRONG_TREND:
      trade_allowed: true
      position_size_mult: 1.2
      stop_loss_mult: 1.5
      use_trailing_stop: true
    WEAK_TREND:
      trade_allowed: true
      position_size_mult: 1.0
      stop_loss_mult: 1.0
      use_trailing_stop: false
    CHOP:
      trade_allowed: false
      position_size_mult: 0.5
      stop_loss_mult: 0.8
      use_trailing_stop: false
    MEAN_REVERT:
      trade_allowed: true
      position_size_mult: 0.8
      stop_loss_mult: 1.2
      fade_momentum: true
    BREAKOUT:
      trade_allowed: true
      position_size_mult: 1.0
      stop_loss_mult: 1.3
      use_trailing_stop: true
      entry_on_pullback: true
  lgbm:
    enabled: true
    train_per_regime: true
    min_samples_per_regime: 100
    fallback_regime: WEAK_TREND
buddy:
  head_hidden: 64
  head_layers: 3
  head_dropout: 0.2
  dense_hidden: 128
  dense_dropout: 0.3
  train_defaults:
    default_candles: 25000
    tier2_calibration_stride: 3
    tier2_horizon_candles: 48
    seq_len: 60
    epochs: 200
    batch_size: 64
    lr: 0.0003
    patience: 40
    es_monitor: combined
    combined_w_dir: 0.6
    combined_w_conf: 0.4
    steps_per_execution: 10
    shared_encoder: true
    fit_verbose: 2
    mixed_precision: true
    jit_compile: true
    cache_val: true
    no_train_smoothing: true
    use_transformer: true
    use_regime: true
    regime_lookback: 20
    regime_lookahead: 12
    direction_threshold: 0.003
    direction_lookahead: 24
  stop_loss_pips: 15.0
  take_profit_pips: 30.0
  tier2_horizon_candles: 24
  tier2_spread_fallback_pips: 1.5
  tier2_tie_break: sl
  risk_per_trade_pct: 0.02
  tier2:
    enabled: true
    p_win_threshold: 0.45
    use_model_confidence_for_gate: true
    remove_confidence_gate: false
    model_conf_threshold: 0.55
    require_both: true
    kelly_fraction: 0.15
    max_risk_per_trade_pct: 0.01
    force_temperature_scaling: true
    require_trending: true
    min_atr_percentile: 0.3
  triple_barrier:
    enabled: true
    use_for_direction: true
    exclude_timeouts: false
    timeout_weight: 0.3
    use_best_direction: true
  meta_labeling:
    enabled: true
    n_estimators: 200
    max_depth: 4
    learning_rate: 0.1
    threshold: 0.55
xgboost:
  enabled: true
  run_baseline_check: true
  n_estimators: 200
  max_depth: 4
  learning_rate: 0.1
  min_child_weight: 3
  gamma: 0.1
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 1.0
  early_stopping_rounds: 50
monitoring:
  enable_memory_monitoring: true
  memory_check_interval: 30
  cpu_memory_threshold: 80
  log_memory_usage: true
performance:
  max_mse: 0.1
  min_accuracy: 0.55
  min_r2_score: 0.1
augmentation:
  enabled: true
  factor: 2
  noise_level: 0.01
  use_mixup: true
  mixup_alpha: 0.2
diagnostics:
  enabled: true
  run_xgboost_baseline: true
  log_gradient_stats: true
  log_feature_importance: true
  save_label_distribution: true
validation_metrics:
  var:
    enabled: true
    lambda_param: 0.94
    confidence_level: 0.95
    violation_target: 0.05
    min_history: 60
    significance_level: 0.05
  rapi:
    enabled: true
    min_rapi: 1.3
    annualization_factor: 15.87
    costs_by_tier:
      major: 0.005
      cross: 0.007
      emerging: 0.009
  baseline:
    enabled: true
    run_on_summary_only: true
    methods:
    - buy_hold
    - random_walk
    - sma_crossover
    - momentum
    min_outperformance: 0.05
scan:
  offline_sizer_enabled: false
  lookback_candles: 200
  parallel_workers: 4
  backtest_window: 50
  auto_retrain_prompt: true
  drift_threshold: 0.03
  min_confidence: 0.53
  position_sizing_enabled: true
  regime_scaling_enabled: true
  aggressive_scale_high_vol: 1.5
  aggressive_scale_extreme_vol: 1.75
  aggressive_min_meta_confidence: 0.52
  account_equity: 0
  risk_per_trade_pct: 0.05
  leverage: 50
  aggressive_mode: true
  min_sl_pips: 15.0
  max_sl_pips: 15.0
  min_tp_pips: 20.0
  max_tp_pips: 30.0
  high_prob_threshold: 0.65
  high_prob_tp_bonus: 20.0
  enable_order_flow_agent: true
  enable_calendar_blackout: true
  news_sentiment_fast_mode: true
  enable_news_sentiment: true
  max_trades_per_day: 30
  default_pairs:
  - EUR_USD
  - GBP_USD
  - USD_JPY
  - USD_CHF
  - AUD_USD
  - USD_CAD
  - NZD_USD
online_retraining:
  enabled: true
  cooldown_minutes: 60
  max_retrains_per_day: 3
  min_samples_for_retrain: 50
fx_validation:
  enabled: true
  level: staging
  criteria:
    direction_accuracy_min: 0.53
    balanced_accuracy_min: 0.53
    cv_std_max: 0.08
    bootstrap_ci_lower: 0.51
    max_cv_degradation: 0.15
    max_prediction_collapse: 0.15
    min_r2_score: 0.01
    min_acceleration_accuracy: 0.55
    max_momentum_mae: 0.15
    max_drawdown_mae_bps: 100.0
    max_streak_prob_mae: 0.15
    min_data_size: 2000
    max_class_imbalance: 0.7

# ═══════════════════════════════════════════════════════════════════════════════
# SOTA / NEURAL AGENT SWITCHES — flipped 2026-06-15
# ═══════════════════════════════════════════════════════════════════════════════
sota:
  use_sota_inference: true
  sota_model_path: "trained_data/models/sota_finetuned/sota_model.keras"

neural_agents:
  use_neural_agents: true
  neural_agent_save_dir: "trained_data/models/neural_agents"
