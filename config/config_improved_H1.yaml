# =============================================================================
# IMPROVED Configuration for FX Trading Bot - H1 TIMEFRAME
# =============================================================================
# Optimized for H1 (Hourly) candles - less noise, cleaner patterns
# =============================================================================

# ----- REPRODUCIBILITY CONFIGURATION -----
reproducibility:
  enabled: true
  global_seed: 42
  # Set to null to disable seeding (non-deterministic training)
  # Can be overridden via RANDOM_SEED environment variable

# ----- PATH CONFIGURATION -----
paths:
  data_dir: trained_data/data
  model_dir: trained_data/models
  checkpoint_dir: trained_data/checkpoints
  log_dir: trained_data/logs
  cache_dir: trained_data/cache
  viz_dir: trained_data/visualizations
  tensorboard_dir: trained_data/tensorboard

# ----- DEVICE CONFIGURATION FOR M1 METAL -----
device: gpu

# ----- DATA CONFIGURATION -----
data:
  data_dir: market_data/
  cache_dir: trained_data/cache
  required_features:
    - open
    - high
    - low
    - close
    - volume
    - rsi
    - macd
    - macd_signal
    - macd_hist
    - bb_upper_20
    - bb_lower_20
    - bb_width_20
    - bb_position_20
    - atr
    - adx
    - stoch_k
    - stoch_d
    - cci
    - obv
    - mfi
    - williams_r
    - sma_5
    - sma_10
    - sma_20
    - sma_50
    - ema_12
    - ema_26
    - returns
    - volatility_20
    - momentum_10
    - zscore_20
    - roc_5
    - roc_10
    - roc_20

# ----- SEQUENCE CONFIGURATION -----
sequence_length: 60

# ----- H1 DIRECTION LABELING -----
# Look 24 bars ahead (24 hours = 1 day) for cleaner signals on H1
# Higher threshold (0.3%) = more balanced labels, less class imbalance
direction_lookahead: 24
direction_threshold: 0.0075  # Min 0.75% move for clear signal (Phase 4: Increased from 0.003 to 0.0075 for stricter labeling with smaller dataset)

# ----- FEATURE SELECTION -----
# RF importance-based selection reduces noisy features and improves generalization
use_feature_selection: true
feature_selection_method: random_forest  # Options: random_forest, f_test, correlation, mutual_info
top_k_features: 50  # Reduce from 199 to top 50 most important features

# ----- MODEL CONFIGURATION -----
model:
  type: ensemble
  
  # Feature dimension (will be auto-detected)
  input_size: 192
  
  # Increased capacity for H1 patterns
  hidden_size: 64
  num_layers: 3
  
  # Moderate dropout (reduced from 0.5 - was suppressing minority class learning)
  dropout: 0.3
  
  # Keep at 0 for M1 Metal speed
  recurrent_dropout: 0.0
  
  # Moderate L2 regularization (reduced from 0.005 - was too strong)
  kernel_regularizer: 0.001
  
  # TCN-specific - AGGRESSIVE ANTI-OVERFITTING (was getting 38% val, worse than random)
  tcn_hidden_size: 16      # Reduced from 32 - smaller capacity
  tcn_num_layers: 1        # Reduced from 2 - simpler model
  tcn_kernel_size: 2       # Reduced from 3 - less receptive field
  tcn_dropout: 0.6         # Increased from 0.3 - heavy dropout
  tcn_l2_reg: 0.01         # L2 kernel regularization
  tcn_spatial_dropout: 0.3 # Spatial dropout on input features
  tcn_noise_std: 0.05      # Gaussian noise on input
  use_residual: false      # Disabled - was helping memorization
  
  # Multi-task heads
  multi_task: true
  state_classes: 4    # Market states: LOW, NORMAL, HIGH, EXTREME volatility
  
  # Attention heads
  num_heads: 4

# =============================================================================
# ENSEMBLE CONFIGURATION (Added for compliance)
# =============================================================================
ensemble:
  enabled: true
  method: "voting"           # Options: voting, bagging, boosting
  n_models: 3                # Number of ensemble members
  weights: "auto"            # Weight calculation: auto, uniform, performance
  bootstrap: true            # Use bootstrap sampling for bagging
  aggregation: "soft"        # soft (probabilities) or hard (labels)

# ----- TRANSFORMER DIRECTION MODEL -----
# Replaces TCN for direction prediction - better at capturing trends
transformer:
  d_model: 32          # Increased from 16 — 16 was too small for 50-feature input
  num_heads: 4         # Increased from 2 — allows richer attention patterns
  num_layers: 2        # 2 encoder layers (good balance)
  dff: 64              # Increased from 32 — feedforward needs 2x d_model minimum
  dropout: 0.2         # Reduced from 0.3 — less regularization for larger model
  label_smoothing: 0.05 # Mild smoothing
  l2_reg: 0.003        # Reduced from 0.005 — lighter L2 for larger model
  input_noise: 0.02    # Reduced from 0.03 — less signal corruption
  spatial_dropout: 0.10 # NEW: Wired through config (was hardcoded 0.15)
  projection_dropout: 0.10 # NEW: Wired through config (was hardcoded 0.15)
  head_dropout: 0.10   # NEW: Wired through config (was hardcoded 0.15)
  
  # === TIME-SERIES AUGMENTATION (Phase 4) ===
  use_augmentation: true                  # Enable data augmentation for smaller dataset
  augmentation_noise_std: 0.01            # Gaussian noise std dev
  augmentation_scale_range: [0.98, 1.02]  # Random scaling range (98% to 102%)
  augmentation_time_mask_prob: 0.1        # Probability of time masking
  augmentation_time_mask_max_len: 5       # Max length of time mask (5 timesteps)
  
  use_transformer: true  # Use Transformer instead of TCN for direction

# ----- TCN VOLATILITY REGIME FILTER -----
# TCN predicts volatility regime (0=LOW, 1=NORMAL, 2=HIGH, 3=EXTREME)
# Acts as entry timing filter - only trade when volatility is HIGH or EXTREME
# Transformer handles direction prediction alone (weight=1.0)
use_tcn_volatility_filter: true     # TCN as volatility gate (not direction ensemble)
transformer_weight: 1.0             # Transformer-only for direction prediction

# Volatility regime calculation settings
volatility_regime:
  lookback_bars: 100                # Rolling window for ATR percentile calculation
  thresholds: [0.25, 0.60, 0.85]    # Percentile boundaries: LOW/NORMAL/HIGH/EXTREME
  min_regime_for_trade: 0           # Minimum regime to allow trade (0=LOW, 1=NORMAL, 2=HIGH, 3=EXTREME)
  tcn_required: false               # Allow graceful degradation if TCN model unavailable

# ----- OPTIMIZER CONFIGURATION -----
optimizer:
  type: adamw
  
  # Learning rate - reduced to prevent fast overfitting
  learning_rate: 0.0001
  
  # Weight decay - REDUCED to prevent over-regularization (was 0.05, too aggressive)
  weight_decay: 0.001
  
  betas:
    - 0.9
    - 0.999
  
  # Gradient clipping
  clipnorm: 0.5

# ----- TRAINING CONFIGURATION -----
training:
  epochs: 300
  
  # === ENSEMBLE CONFIGURATION (Added for compliance) ===
  use_ensemble: true
  
  # Increased patience to allow longer training
  early_stopping_patience: 40
  
  # Minimum epochs before early stopping (ensures adequate training)
  min_epochs: 60
  
  # Warmup epochs for stable early training
  warmup_epochs: 5
  
  # RL position sizer - DISABLED (use train-rl-sizer command separately)
  auto_train_rl: false
  
  # === WARM-START SETTINGS (Phase 2: Adjusted to reduce degradation) ===
  # Warm-start learning rate factor - 3x reduction allows adaptation while preserving knowledge
  warm_start_lr_factor: 0.3  # 0.3 = 3x LR reduction (was 0.1 = 10x, too aggressive)
  # Gradual layer unfreezing - unfreeze earlier for faster adaptation
  warm_start_unfreeze_epochs: 5  # Unfreeze encoder layers after N epochs (was 10, too late)
  warm_start_gradual_unfreeze: true  # Unfreeze gradually from top to bottom
  warm_start_freeze_encoder: false  # Allow selective fine-tuning (was true, blocked all)
  warm_start_encoder_layers_to_freeze: 2  # Only freeze first 2 encoder layers (new)
  warm_start_gradual_unfreeze_strategy: true  # Enable gradual unfreezing strategy (new)
  
  # Max gap between train/val before stopping
  max_overfit_gap: 0.15
  
  # M1 optimizations
  jit_compile: false
  run_eagerly: false
  
  # Batch progress
  batch_progress_every: 50

# =============================================================================
# RL INTEGRATION CONFIGURATION
# =============================================================================
rl_integration:
  # Master switch - when false all RL features are treated as optional and skipped
  enabled: false

  # Auto-train RL components after ensemble training completes
  # Keeps backward compatibility with training.auto_train_rl when omitted
  auto_train_after_ensemble: false

  # =======================================================================
  # POSITION SIZING (PPO)
  # =======================================================================
  position_sizing:
    enabled: true
    model_path: "trained_data/models/rl_position_sizer.zip"
    scaler_path: "trained_data/models/rl_scaler.pkl"

    # Training
    timesteps: 50000
    learning_rate: 0.0003
    n_steps: 256
    batch_size: 32
    n_epochs: 5
    gamma: 0.99
    gae_lambda: 0.95

    # Environment
    sequence_length: 60
    max_position_pct: 0.10
    min_position_pct: 0.01

    # Reward shaping
    sharpe_weight: 0.1
    drawdown_penalty: 0.5
    win_rate_bonus: 0.2

    # Risk limits and fallback
    max_drawdown_pct: 0.10
    daily_loss_limit_pct: 0.03
    fallback_pct: 0.01

  # =======================================================================
  # GATE OPTIMIZATION (SAC)
  # =======================================================================
  gate_optimization:
    enabled: false
    model_path: "trained_data/models/sac_gate_thresholds.zip"
    timesteps: 100000
    learning_rate: 0.0003
    buffer_size: 100000
    batch_size: 256
    confidence_bounds: [0.5, 0.8]
    momentum_bounds: [0.1, 0.5]
    risk_bounds: [0.01, 0.05]
    meta_bounds: [0.5, 0.7]
    default_thresholds:
      confidence: 0.60
      momentum: 0.20
      risk: 0.025
      meta: 0.55

  # =======================================================================
  # EXIT TIMING (PPO)
  # =======================================================================
  exit_timing:
    enabled: false
    model_path: "trained_data/models/ppo_optimal_exit.zip"
    timesteps: 100000
    learning_rate: 0.0003
    hold_action: 0
    take_profit_action: 1
    stop_loss_action: 2
    min_profit_for_tp: 0.002
    max_loss_for_sl: -0.003
    max_bars_held: 24

  # =======================================================================
  # REWARD MODEL
  # =======================================================================
  reward_model:
    enabled: false
    use_ensemble_predictions: true
    include_risk_metrics: true
    reward_horizon_bars: 24
    normalize_rewards: true
    weight_in_env: 0.3

  # =======================================================================
  # INFERENCE INTEGRATION
  # =======================================================================
  inference:
    position_size_source: "rl"   # rl, fixed, kelly
    threshold_adaptation_weight: 0.5
    exit_timing_confidence: 0.7
    fallback_on_error: true
    log_rl_decisions: true

# ----- BATCH SIZE -----
batch_size: 64

# ----- LEARNING RATE SCHEDULE -----
scheduler:
  type: cosine_annealing
  T_max: 50
  eta_min: 0.00001

# ----- COSINE WARM RESTARTS (Recommended) -----
# Enables learning rate warm restarts for better convergence
lr_schedule:
  type: cosine_restarts
  first_decay_epochs: 15
  t_mul: 2.0
  m_mul: 0.9
  warmup_epochs: 5
  alpha: 0.01

# ----- LOSS CONFIGURATION -----
loss_type: huber
huber_delta: 1.0

# ----- MULTI-TASK HEAD LOSS WEIGHTS -----
unified_head_loss_weights:
  price: 1.0
  trend: 0.5
  direction: 5.0
  risk: 2.0
  state_logits: 2.0

# ----- FOCAL LOSS FOR DIRECTION -----
use_focal_loss: true  # Use BinaryFocalLoss instead of BinaryCrossentropy for class imbalance
auto_focal_alpha: true
focal_gamma: 2.0
direction_loss: focal

# === Hybrid Class-Balanced + Anti-Collapse Loss ===
# Combines class-balanced loss (addresses class imbalance via effective sample weighting)
# with anti-collapse regularization (prevents probability collapse to single class).
# The hybrid approach: CB loss provides per-class weighting based on effective samples,
# while anti-collapse adds variance regularization to maintain prediction diversity.
use_hybrid_cb_anticollapse: true  # Enable hybrid loss (takes priority over individual flags)
use_class_balanced_loss: true     # Class-balanced focal loss for rare class handling
cb_beta: 0.9999                   # CB beta parameter (higher = more weight to rare classes)
cb_gamma: 2.0                     # Focal gamma (higher = more focus on hard examples)

# === Anti-Collapse Loss Settings (v2) ===
use_anti_collapse_loss: true  # Use AntiCollapseFocalLoss with variance regularization
anti_collapse_base_variance_weight: 0.2  # INCREASED: Base variance weight (was 0.1, more aggressive)
anti_collapse_label_smoothing: 0.05  # Label smoothing for collapse prevention
sample_weight_max_multiplier: 5.0  # Max sample weight multiplier (increased from 3.0 for hybrid)

# ----- DATA SCALING -----
enable_data_scaling: true
normalize_features: true

# ----- MIXED PRECISION -----
# DISABLED: M1 Metal doesn't support mixed_float16 efficiently
mixed_precision: false

# ----- VALIDATION -----
validation_split: 0.15

# ----- EARLY STOPPING -----
early_stop_monitor: val_loss
early_stopping_patience: 40
min_epochs: 60

# ----- REGULARIZATION -----
noise_std: 0.02
kernel_regularizer: 0.001

# ----- INFERENCE GATE THRESHOLDS -----
inference:
  # Gate 1: Transformer/TCN direction confidence
  min_tcn_probability: 0.60  # 60% minimum confidence (not coin-flip)
  
  # Gate 2: Ridge confidence (ADX-based trend strength)
  min_confidence: 50.0  # 0-100 scale
  
  # Gate 3: XGBoost momentum
  min_momentum: 0.20  # Percentile threshold
  require_fresh_or_accel: true  # Also pass if momentum is accelerating
  
  # Gate 4: RandomForest risk
  max_drawdown_pct: 0.025  # 2.5% max expected drawdown
  max_streak_prob: 0.95  # 95% max streak continuation probability
  
  # Gate 5: Meta-labeling
  enable_meta_labeling: true
  min_meta_confidence: 0.55  # 55% trade success probability
  
  # Gate 6: Sentiment
  sentiment_block_enabled: true
  sentiment_block_threshold: 0.60  # Block on strong contrary sentiment
  sentiment_min_headlines: 3
  
  # General
  permissive_mode: false
  bypass_risk_gate_in_permissive: false
  
  # Calibration
  enable_calibration: true
  calibration_method: platt

# ----- NEWS & SENTIMENT DATA SOURCE -----
# Configuration for news_features.py callback system
news:
  enabled: true
  source: "rss"  # or "api" for future premium sources
  max_headlines: 10
  sentiment_model: "finbert"  # or "simple" for lexicon-based fallback

# ----- WALK-FORWARD CROSS-VALIDATION -----
# Robust time-series validation to prevent look-ahead bias
walkforward:
  enabled: true                    # Enable walk-forward validation
  mode: "rolling"                  # "rolling" (sliding window) or "expanding" (growing window)
  n_splits: 5                      # Number of folds
  train_size: 0.60                 # Training window size (60% of data for rolling)
  val_size: 0.10                   # Validation size (10%)
  test_size: 0.10                  # Test/holdout size (10%)
  gap: 24                          # Gap between train/val (24 H1 bars = 1 day)
  min_train_size: 2000             # Minimum training samples per fold
  
  # Purged K-Fold settings (advanced)
  use_purged_kfold: true           # Use purged cross-validation
  purge_gap: 24                    # Purge samples near test (24 H1 bars = 1 day)
  embargo_gap: 12                  # Embargo after train (12 H1 bars = 12 hours)
  
  # Model retraining per fold
  retrain_per_fold: true           # Retrain model for each fold (recommended)
  aggregate_method: "best"         # "best", "average", or "ensemble"
  
  # Regime-aware validation
  ensure_regime_balance: false     # Ensure each fold has all regimes (experimental)
  min_samples_per_regime: 50       # Min samples per regime in each fold

# ----- TENSORBOARD -----
tensorboard:
  enabled: true
  log_dir: trained_data/tensorboard
  histogram_freq: 1
  write_graph: true
  write_images: false
  profile_batch: 0
  update_freq: epoch

# ----- FX TRADING CONFIGURATION -----
fx:
  enabled: true
  tier: 1
  timezone: America/New_York
  granularity: H1  # HOURLY TIMEFRAME
  horizon_bars: 1
  equity: 10000.0
  instruments:
    - EUR_USD
    - GBP_USD
    - USD_JPY
  session:
    start: "08:00"
    end: "11:30"
    force_flat_at: "11:55"
    reset_at: "08:00"
  limits:
    max_open_positions: 1
    max_entries_per_day: 1
  risk:
    risk_per_trade_pct: 0.02
    daily_loss_stop_pct: 0.05
    atr_stop_mult: 1.5
    rr_take_profit: 2.0
  execution:
    require_confirmation: true
    practice_only: true
  costs:
    max_spread_pips:
      EUR_USD: 1.0
      GBP_USD: 1.6
      USD_JPY: 1.2
    slippage_pips_min: 0.2
    slippage_pips_spread_mult: 0.25
  confidence:
    low_lt: 0.6
    high_gte: 0.75

# ----- 5-CLASS REGIME CONFIGURATION (Phase 3) -----
# Market regime detection for dynamic model selection and strategy adaptation
regime:
  enabled: true
  num_classes: 5  # STRONG_TREND, WEAK_TREND, CHOP, MEAN_REVERT, BREAKOUT
  
  # ADX thresholds for trend strength classification
  thresholds:
    adx_strong_trend: 40      # ADX >= 40 = STRONG_TREND
    adx_weak_trend: 25        # ADX 25-40 = WEAK_TREND
    adx_chop: 20              # ADX < 20 = CHOP (avoid trading)
    adx_breakout_max: 30      # BREAKOUT: ADX < 30 but rising
    
    # RSI extremes for mean reversion detection
    rsi_extreme_low: 30       # RSI < 30 = oversold (MEAN_REVERT)
    rsi_extreme_high: 70      # RSI > 70 = overbought (MEAN_REVERT)
    
    # ATR expansion for breakout detection
    atr_expansion_ratio: 1.3  # Current ATR > 1.3x 5-bar MA = expanding
    adx_rise_threshold: 2     # ADX increased by > 2 points over 3 bars
  
  # Regime transition handling
  transition:
    cooldown_bars: 3          # Wait 3 bars after regime change
    min_confidence: 0.6       # Minimum confidence to act on regime
    confirm_bars: 2           # Require 2 of last 3 bars in new regime
  
  # Per-regime trading behavior
  behavior:
    STRONG_TREND:
      trade_allowed: true
      position_size_mult: 1.2  # Larger positions in strong trends
      stop_loss_mult: 1.5      # Wider stops
      use_trailing_stop: true
      
    WEAK_TREND:
      trade_allowed: true
      position_size_mult: 1.0  # Normal position size
      stop_loss_mult: 1.0      # Normal stops
      use_trailing_stop: false
      
    CHOP:
      trade_allowed: false     # Skip trading in chop
      position_size_mult: 0.5
      stop_loss_mult: 0.8
      use_trailing_stop: false
      
    MEAN_REVERT:
      trade_allowed: true
      position_size_mult: 0.8  # Smaller positions for reversals
      stop_loss_mult: 1.2
      fade_momentum: true      # Trade against 2-bar momentum
      
    BREAKOUT:
      trade_allowed: true
      position_size_mult: 1.0
      stop_loss_mult: 1.3
      use_trailing_stop: true
      entry_on_pullback: true  # Wait for pullback after breakout
  
  # Regime-specific LightGBM model settings
  lgbm:
    enabled: true
    train_per_regime: true    # Train 5 separate models
    min_samples_per_regime: 100
    fallback_regime: WEAK_TREND

# ----- BUDDY CONFIGURATION -----
buddy:
  head_hidden: 64
  head_layers: 3
  head_dropout: 0.2
  dense_hidden: 128
  dense_dropout: 0.3
  
  train_defaults:
    # DATA SETTINGS - Increased for better model training
    default_candles: 25000     # 25k H1 candles = ~1041 days (~3 years) - extended for better training with stricter threshold
    tier2_calibration_stride: 3  # Every 3 H1 candles (3 hours) - appropriate for H1
    tier2_horizon_candles: 48    # 48 H1 candles = 2 days
    seq_len: 60
    epochs: 200
    batch_size: 64
    lr: 0.0003
    patience: 40
    es_monitor: combined
    combined_w_dir: 0.6
    combined_w_conf: 0.4
    steps_per_execution: 10
    shared_encoder: true
    fit_verbose: 2
    mixed_precision: true
    jit_compile: true
    cache_val: true
    no_train_smoothing: true  # CRITICAL: Disable M5 resampling for H1 data
    # top_features: 20  # DISABLED: Conflicts with warm-start. Use --all-features (enabled by default)
    
    # REGIME MODEL SETTINGS (replaces direction prediction)
    use_transformer: true      # Use Transformer architecture
    use_regime: true           # NEW: Classify market regime instead of direction
    regime_lookback: 20        # 20 bars to analyze regime
    regime_lookahead: 12       # 12 bars to confirm regime
    # Legacy direction settings (only used if use_regime: false)
    direction_threshold: 0.003 # Min 0.3% move for clear signal
    direction_lookahead: 24    # 24 hours lookahead
  
  # TIGHT SCALPING SL/TP - Quick targets for volatile markets
  stop_loss_pips: 15.0    # 15 pips SL - tight risk (user requested)
  take_profit_pips: 30.0  # 30 pips TP base (50 if prob > 65%)
  tier2_horizon_candles: 24  # 24 hours max to hit target
  tier2_spread_fallback_pips: 1.5
  tier2_tie_break: "sl"
  risk_per_trade_pct: 0.02  # 2% risk for larger lots
  
  tier2:
    enabled: true
    p_win_threshold: 0.45
    use_model_confidence_for_gate: true
    remove_confidence_gate: false
    model_conf_threshold: 0.55
    require_both: true
    kelly_fraction: 0.15
    max_risk_per_trade_pct: 0.01
    force_temperature_scaling: true
    require_trending: true
    min_atr_percentile: 0.3

  # ----- TRIPLE BARRIER LABELING -----
  triple_barrier:
    enabled: true
    use_for_direction: true
    exclude_timeouts: false
    timeout_weight: 0.3
    use_best_direction: true
  
  # ----- META-LABELING -----
  meta_labeling:
    enabled: true  # Disabled: meta_labeler.pkl not trained yet
    n_estimators: 200
    max_depth: 4
    learning_rate: 0.1
    threshold: 0.55

# ----- XGBOOST BASELINE -----
xgboost:
  enabled: true
  run_baseline_check: true
  n_estimators: 200
  max_depth: 4
  learning_rate: 0.1
  min_child_weight: 3
  gamma: 0.1
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 1.0
  early_stopping_rounds: 50

# ----- MEMORY MONITORING -----
monitoring:
  enable_memory_monitoring: true
  memory_check_interval: 30
  cpu_memory_threshold: 80
  log_memory_usage: true

# ----- PERFORMANCE TARGETS -----
performance:
  max_mse: 0.1
  min_accuracy: 0.55
  min_r2_score: 0.1

# ----- DATA AUGMENTATION -----
augmentation:
  enabled: true
  factor: 2
  noise_level: 0.01
  use_mixup: true
  mixup_alpha: 0.2

# ----- DIAGNOSTIC SETTINGS -----
diagnostics:
  enabled: true
  run_xgboost_baseline: true
  log_gradient_stats: true
  log_feature_importance: true
  save_label_distribution: true

# ----- VALIDATION METRICS SETTINGS -----
# Configuration for Phase 2 validation metrics (VaR, RAPI, Baselines)
validation_metrics:
  # VaR Backtesting Configuration
  var:
    enabled: true
    lambda_param: 0.94       # EWMA decay factor (RiskMetrics standard)
    confidence_level: 0.95   # 95% VaR (5% target violation rate)
    violation_target: 0.05   # Expected violation rate
    min_history: 60          # Minimum warmup period for EWMA
    significance_level: 0.05 # Alpha for Kupiec/Christoffersen tests
  
  # RAPI (Risk-Adjusted Performance Index) Configuration
  rapi:
    enabled: true
    min_rapi: 1.30           # Minimum acceptable RAPI score
    annualization_factor: 15.87  # sqrt(252) for daily
    # Per-pair transaction costs (round-trip %)
    costs_by_tier:
      major: 0.005           # 0.5% (EUR_USD, GBP_USD, USD_JPY, USD_CHF)
      cross: 0.007           # 0.7% (AUD_USD, NZD_USD, USD_CAD, EUR_GBP)
      emerging: 0.009        # 0.9% (USD_MXN, USD_TRY, USD_ZAR)
  
  # Baseline Benchmarking Configuration
  baseline:
    enabled: true
    run_on_summary_only: true  # Only compute on final summary (saves compute)
    methods:
      - buy_hold              # Always long benchmark
      - random_walk           # Random 50/50 (lower bound)
      - sma_crossover         # SMA(5) > SMA(20)
      - momentum              # 5-period momentum
    min_outperformance: 0.05  # Model should beat baselines by 5%+

# ----- BUDDY SCANNER SETTINGS -----
# Configuration for buddy scan command
# TARGET: Aggressive trading for $2k+ per trade
scan:
  # Number of candles to fetch for analysis
  lookback_candles: 200
  
  # Number of parallel workers for scanning
  parallel_workers: 4
  
  # Number of candles for quick backtest validation
  backtest_window: 50
  
  # Prompt user to retrain when drift detected
  auto_retrain_prompt: true
  
  # Model drift threshold (retrain warning if accuracy drops by this much)
  drift_threshold: 0.03
  
  # Minimum confidence to include in results (78% model outputs realistic probs)
  min_confidence: 0.53  # 53%+ is above random, model verified at 78%
  
  # Enable position sizing in scan results
  position_sizing_enabled: true
  
  # Account equity: 0 = fetch live balance from OANDA (recommended for compounding)
  account_equity: 0  # 0 = use live OANDA balance
  
  # Risk per trade percentage - 5% for aggressive trading (~$5k on $100k)
  risk_per_trade_pct: 0.05  # 5% risk per trade (larger lots, ~$2k+ profit potential)
  
  # Leverage ratio
  leverage: 50
  
  # Aggressive mode - enabled for larger position sizes
  aggressive_mode: true
  
  # Tight SL/TP for quick trades
  min_sl_pips: 15.0
  max_sl_pips: 15.0  # Fixed 15 pip SL
  min_tp_pips: 20.0
  max_tp_pips: 30.0  # 20-30 pip TP base
  high_prob_threshold: 0.65  # Bonus TP if prob > 65%
  high_prob_tp_bonus: 20.0   # +20 pips bonus for high prob
  
  # Max trades per day limit
  max_trades_per_day: 30
  
  # Default pairs to scan (if none specified)
  default_pairs:
    - EUR_USD
    - GBP_USD
    - USD_JPY
    - USD_CHF
    - AUD_USD
    - USD_CAD
    - NZD_USD

# ----- ONLINE RETRAINING CONFIGURATION -----
# Drift-triggered incremental model retraining (via OnlineRetrainer)
online_retraining:
  enabled: true
  cooldown_minutes: 60
  max_retrains_per_day: 3
  min_samples_for_retrain: 50

# =============================================================================
# FX-SPECIFIC VALIDATION CRITERIA
# =============================================================================
# Realistic thresholds calibrated for FX market data prediction.
# Academic research shows 52-55% direction accuracy is typical for FX.
# Reference: Cheung et al. (2005), Menkhoff et al. (2012)
fx_validation:
  enabled: true  # Enable FX-specific validation criteria
  
  # Validation level: development, staging, production, conservative
  level: "staging"
  
  # FX-calibrated thresholds (staging level defaults)
  criteria:
    # Direction model thresholds
    direction_accuracy_min: 0.53      # 53% minimum (vs 65% old threshold)
    balanced_accuracy_min: 0.53       # 53% balanced accuracy
    cv_std_max: 0.08                  # 8% max CV std (vs 5% old)
    bootstrap_ci_lower: 0.51          # 51% minimum CI lower bound
    max_cv_degradation: 0.15          # 15% max degradation (vs 10% old)
    max_prediction_collapse: 0.15     # 15% max collapse ratio
    
    # Confidence model thresholds
    min_r2_score: 0.01                # Near zero for FX confidence
    
    # Momentum model thresholds
    min_acceleration_accuracy: 0.55   # 55% acceleration accuracy
    max_momentum_mae: 0.15            # Max momentum MAE
    
    # Risk model thresholds
    max_drawdown_mae_bps: 100.0       # 100 bps max drawdown MAE
    max_streak_prob_mae: 0.15         # Max streak probability MAE
    
    # Data requirements
    min_data_size: 2000               # Minimum training samples
    max_class_imbalance: 0.70         # 70% max class imbalance
