[project]
name = "ml-engine"
version = "2.1.0"
description = "FX trading bot using 4-model gated ensemble"
requires-python = ">=3.10"

[project.scripts]
buddy = "cli_entry:main"

# ── Ruff configuration ────────────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "cli"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "PIE",    # flake8-pie
    "RET",    # flake8-return
    "PERF",   # perflint
    "FURB",   # refurb
    "LOG",    # flake8-logging
    "NPY201", # numpy 2.0 compat
]
ignore = [
    "E501",     # line too long – handled by formatter
    "E402",     # module-level import not at top – lazy imports are intentional
    "B904",     # raise without from – too noisy for existing codebase patterns
    "B905",     # zip-without-explicit-strict – Python 3.10+ target but many loops
    "RET504",   # unnecessary-assign – readability preference
    "RET505",   # superfluous-else-return – readability preference
    "SIM102",   # collapsible-if – readability
    "SIM105",   # suppressible-exception – contextlib.suppress not always clearer
    "SIM108",   # if-else-block-instead-of-if-exp – readability
    "PERF203",  # try-except-in-loop – necessary for resilient processing
    "UP006",    # non-pep585-annotation – not all runtime contexts support it
    "UP007",    # non-pep604-annotation – X | Y union syntax
    "UP035",    # deprecated-import – typing compat
    "UP037",    # quoted-annotation – forward refs intentional
    "UP045",    # non-pep604-optional – Optional[X] style
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811", "E501"]
"*_old*.py" = ["F401", "F811", "E501", "F841"]
"*_backup*" = ["F401", "F811", "E501", "F841"]
"debug_*.py" = ["F401", "F811", "T201", "E501"]
"test_*.py" = ["F401", "F811", "E501", "F841"]
"demo_*.py" = ["T201", "F401", "E501"]
"check_*.py" = ["T201", "F401", "E501"]
"inspect_*.py" = ["T201", "F401", "E501"]

# ── Coverage configuration ────────────────────────────────────────────────
# Run with: pytest --cov=src --cov-report=term-missing --cov-report=html
# Or use the convenience script: scripts/coverage.sh
[tool.coverage.run]
source = ["src"]
branch = true
parallel = false
data_file = ".coverage"
omit = [
    # Tests
    "tests/*",
    # Top-level CLI/script entrypoints (covered by integration tests, not unit)
    "buddy_scanner.py",
    "buddy_intelligent_mode.py",
    "buddy.py",
    "main.py",
    "cli_entry.py",
    # Generated / quarantined code
    "legacy_quarantine/*",
    "*/migrations/*",
    "*/__pycache__/*",
    # Optional / heavy ML training paths excluded from baseline
    "src/training/*",
    "src/strategy_invention/*",
    # TUI is interactive — covered by manual + e2e flows
    "src/tui/*",
    # Backup / orphan files
    "*.orphan_backup",
    "*_old*.py",
    "*_backup*.py",
]

[tool.coverage.report]
# Exclude pragmas, defensive defaults, and unreachable paths from line counts
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "def __repr__",
    "class .*\\bProtocol\\):",
]
precision = 1
show_missing = true
skip_empty = true
skip_covered = false
sort = "Cover"

[tool.coverage.html]
directory = "htmlcov"
title = "ML Engine Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"