# SonarQube Configuration for ML Engine
sonar.projectKey=ml-engine
sonar.projectName=ML Engine Trading Bot
sonar.projectVersion=2.1.0

# Source directories
sonar.sources=src,cli,main.py,cli_entry.py,market_intelligence.py,buddy_intelligent_mode.py,rl_position_sizing.py
sonar.tests=tests

# Language
sonar.language=py

# Source encoding
sonar.sourceEncoding=UTF-8

# Python version
sonar.python.version=3.10

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/__pycache__/**,\
  **/trained_data/**,\
  **/market_data/**,\
  **/*.egg-info/**,\
  **/dist/**,\
  **/build/**,\
  **/*_old*.py,\
  **/*_backup*,\
  **/debug_*.py,\
  **/demo_*.py,\
  **/check_*.py,\
  **/inspect_*.py,\
  **/*_diag_*.py,\
  **/analyze_version_conflicts.py,\
  **/extract_imports.py,\
  **/add_cli_imports.py,\
  **/migrate_keras_models.py

# Test exclusions
sonar.test.exclusions=tests/**

# Coverage
sonar.python.coverage.reportPaths=coverage.xml
