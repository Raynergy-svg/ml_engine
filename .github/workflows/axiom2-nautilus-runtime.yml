name: Axiom 2.0 Nautilus runtime

on:
  push:
    branches:
      - codex/axiom2-nautilus-runtime-2026-10-06
  workflow_dispatch:
    inputs:
      reuse_only:
        description: Fail on cache miss instead of rebuilding the pinned source
        type: boolean
        default: true
      export_artifact:
        description: Export approved ZIP in transfer-sized parts for local Linux verification
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  source-build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}/nautilus/python:${{ github.workspace }}/axiom/src:${{ github.workspace }}/axiom
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out Axiom branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: axiom

      - name: Check out exact Nautilus source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: nautechsystems/nautilus_trader
          ref: 4f021bafc2e99c5490cee204b0fc2bd2c83baab4
          path: nautilus

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.14"

      - name: Install pinned host build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang lld
          python -m pip install --disable-pip-version-check "uv==0.12.23" "pytest==8.3.5"

      - name: Set up the upstream Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0

      - name: Prepare exact Nautilus build manifest
        id: nautilus_manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path

          expected_path = Path("axiom/config/axiom2/nautilus_build_manifest.json")
          expected = json.loads(expected_path.read_text(encoding="utf-8"))

          def command(*args: str) -> str:
              return subprocess.check_output(args, text=True).strip()

          def first_line(*args: str) -> str:
              return command(*args).splitlines()[0]

          source_revision = command("git", "-C", "nautilus", "rev-parse", "HEAD")
          enabled_features = command("bash", "nautilus/scripts/cargo-features.bash")
          python_runtime = command("python", "--version")
          rust_version = command("rustc", "--version")
          uv_version_output = command("uv", "--version")
          uv_version = uv_version_output.split()[1]

          if source_revision != expected["upstream"]["revision"]:
              raise SystemExit(
                  f"unexpected Nautilus source revision: {source_revision}"
              )
          if enabled_features != expected["build"]["enabled_features"]:
              raise SystemExit(
                  f"unexpected Nautilus feature set: {enabled_features}"
              )
          if not python_runtime.startswith(
              f'Python {expected["build"]["python_version"]}'
          ):
              raise SystemExit(f"unexpected Python runtime: {python_runtime}")
          if not rust_version.startswith(
              f'rustc {expected["build"]["rust_toolchain"]}'
          ):
              raise SystemExit(f"unexpected Rust toolchain: {rust_version}")
          if uv_version != expected["build"]["uv_version"]:
              raise SystemExit(f"unexpected uv version: {uv_version}")

          manifest = {
              "schema": expected["schema"],
              "contract_manifest_sha256": hashlib.sha256(
                  expected_path.read_bytes()
              ).hexdigest(),
              "upstream": expected["upstream"],
              "build": {
                  **expected["build"],
                  "source_revision": source_revision,
                  "python_runtime": python_runtime,
                  "rust_version": rust_version,
                  "uv_version_resolved": uv_version_output,
                  "clang_version": first_line("clang", "--version"),
                  "lld_version": first_line("ld.lld", "--version"),
                  "runner_os": os.environ.get("RUNNER_OS", ""),
                  "runner_arch": platform.machine(),
              },
          }

          manifest_path = Path("nautilus/.axiom2-nautilus-build-manifest.json")
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          digest = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"cache_key=nautilus-build-{digest}\n")
              output.write(f"manifest_digest={digest}\n")
              output.write(f"source_revision={source_revision}\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"NAUTILUS_ENABLED_FEATURES={enabled_features}\n")
              env.write(f"NAUTILUS_SOURCE_REVISION={source_revision}\n")
          PY

      - name: Restore exact Nautilus Python build
        id: nautilus_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            nautilus/python/.venv
            nautilus/python/nautilus_trader/_libnautilus*.so
            nautilus/.axiom2-nautilus-build-manifest.json
          key: ${{ steps.nautilus_manifest.outputs.cache_key }}

      - name: Restore approved artifact when the exact branch cache is unavailable
        if: inputs.reuse_only && (steps.nautilus_cache.outputs.cache-hit != 'true' || inputs.export_artifact)
        env:
          GH_TOKEN: ${{ github.token }}
          EXPORT_APPROVED_ARTIFACT: ${{ inputs.export_artifact }}
        run: python axiom/scripts/axiom2_restore_nautilus_artifact.py

      - name: Recreate only the isolated test environment for the approved extension
        if: inputs.reuse_only && steps.nautilus_cache.outputs.cache-hit != 'true'
        working-directory: nautilus
        run: make sync

      - name: Sync and build the unmodified upstream source
        if: steps.nautilus_cache.outputs.cache-hit != 'true' && !inputs.reuse_only
        working-directory: nautilus
        env:
          CI: "true"
        run: |
          make sync
          export PYO3_PYTHON="$PWD/python/.venv/bin/python"
          make build

      - name: Verify exact Nautilus build package
        run: |
          set -euo pipefail
          test -x nautilus/python/.venv/bin/python
          extension="$(find nautilus/python/nautilus_trader -maxdepth 1 -type f -name '_libnautilus*.so' -print -quit)"
          test -n "$extension"
          test "$(sha256sum nautilus/.axiom2-nautilus-build-manifest.json | awk '{print $1}')" = "${{ steps.nautilus_manifest.outputs.manifest_digest }}"
          test "$(git -C nautilus rev-parse HEAD)" = "${{ steps.nautilus_manifest.outputs.source_revision }}"
          nautilus/python/.venv/bin/python - <<'PY'
          from nautilus_trader.common import ComponentState
          assert str(ComponentState.READY)
          print("verified exact Nautilus package and ComponentState string conversion")
          PY

      - name: Save exact Nautilus Python build cache
        if: steps.nautilus_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            nautilus/python/.venv
            nautilus/python/nautilus_trader/_libnautilus*.so
            nautilus/.axiom2-nautilus-build-manifest.json
          key: ${{ steps.nautilus_manifest.outputs.cache_key }}

      - name: Preserve exact Nautilus build package and manifest
        if: steps.nautilus_cache.outputs.cache-hit != 'true' && !inputs.reuse_only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nautilus-build-${{ steps.nautilus_manifest.outputs.manifest_digest }}
          path: |
            nautilus/python/.venv
            nautilus/python/nautilus_trader/_libnautilus*.so
            nautilus/.axiom2-nautilus-build-manifest.json
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true

      - name: Preserve small artifact reuse receipt
        if: inputs.reuse_only && (steps.nautilus_cache.outputs.cache-hit != 'true' || inputs.export_artifact)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nautilus-reuse-receipt
          path: ${{ runner.temp }}/nautilus-reuse-receipt.json
          if-no-files-found: error

      - name: Export approved artifact part 1
        if: inputs.export_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: approved-nautilus-part1
          path: ${{ runner.temp }}/approved-nautilus.part1
          if-no-files-found: error
          retention-days: 1

      - name: Export approved artifact part 2
        if: inputs.export_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: approved-nautilus-part2
          path: ${{ runner.temp }}/approved-nautilus.part2
          if-no-files-found: error
          retention-days: 1

      - name: Export approved artifact part 3
        if: inputs.export_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: approved-nautilus-part3
          path: ${{ runner.temp }}/approved-nautilus.part3
          if-no-files-found: error
          retention-days: 1

      - name: Install exact Axiom comparison test dependencies
        run: uv pip install --python nautilus/python/.venv/bin/python -r axiom/requirements-axiom2-research.txt -r axiom/requirements-axiom2-nautilus-tests.txt

      - name: Run contract tests
        if: ${{ always() }}
        working-directory: axiom
        run: python -m pytest -q tests/axiom2/test_nautilus_smoke_contract.py tests/axiom2/test_nautilus_artifact_redirect.py

      - name: Run actual public-interface smoke harness
        if: ${{ always() }}
        working-directory: axiom
        env:
          NAUTILUS_SOURCE_REVISION: 4f021bafc2e99c5490cee204b0fc2bd2c83baab4
          NAUTILUS_BUILD_MODE: approved unchanged Linux extension; exact matching source/toolchain manifest; isolated test environment
        run: |
          ../nautilus/python/.venv/bin/python scripts/axiom2_nautilus_smoke.py > "$RUNNER_TEMP/nautilus-smoke.json"
          cat "$RUNNER_TEMP/nautilus-smoke.json"

      - name: Run Nautilus-backed Axiom runtime tests
        if: ${{ always() }}
        working-directory: axiom
        run: PYTHONPATH="$GITHUB_WORKSPACE/nautilus/python:$GITHUB_WORKSPACE/axiom/src:$GITHUB_WORKSPACE/axiom" ../nautilus/python/.venv/bin/python -m pytest -q tests/axiom2/nautilus_runtime/test_runtime_recovery.py tests/axiom2/nautilus_runtime/test_candidate_monitor.py tests/axiom2/nautilus_runtime/test_monitor_completion.py tests/axiom2/nautilus_runtime/test_projection_contract.py

      - name: Run offline Nautilus order-lifecycle tests
        if: ${{ always() }}
        working-directory: axiom
        run: PYTHONPATH="$GITHUB_WORKSPACE/nautilus/python:$GITHUB_WORKSPACE/axiom/src:$GITHUB_WORKSPACE/axiom" ../nautilus/python/.venv/bin/python -m pytest -q tests/axiom2/nautilus_runtime/test_order_lifecycle.py

      - name: Run the complete current Axiom and evidence gate
        if: ${{ always() }}
        working-directory: axiom
        run: ../nautilus/python/.venv/bin/python -m pytest tests/axiom2 tests/evidence/equity_research tests/test_evidence_contracts.py tests/test_evidence_store.py tests/test_equity_research_evidence_slice.py tests/test_equity_research_evidence_worker_no_authority.py -q -W error --junitxml="$RUNNER_TEMP/axiom-scoped-tests.xml"

      - name: Preserve small verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nautilus-verification-evidence
          path: |
            ${{ runner.temp }}/axiom-scoped-tests.xml
            ${{ runner.temp }}/nautilus-smoke.json
            nautilus/.axiom2-nautilus-build-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
