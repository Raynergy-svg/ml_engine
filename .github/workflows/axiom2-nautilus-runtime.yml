name: Axiom 2.0 Nautilus runtime

on:
  push:
    branches:
      - codex/axiom2-nautilus-runtime-2026-10-06
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out Axiom branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: axiom

      - name: Check out exact Nautilus source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: nautechsystems/nautilus_trader
          ref: 4f021bafc2e99c5490cee204b0fc2bd2c83baab4
          path: nautilus

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install pinned host build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang lld
          python -m pip install --disable-pip-version-check "uv>=0.12,<0.13" "pytest==8.3.5"

      - name: Set up the upstream Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0

      - name: Sync and build the unmodified upstream source
        working-directory: nautilus
        env:
          CI: "true"
        run: |
          make sync
          echo "NAUTILUS_ENABLED_FEATURES=$(bash scripts/cargo-features.bash)" >> "$GITHUB_ENV"
          export PYO3_PYTHON="$PWD/python/.venv/bin/python"
          make build

      - name: Run contract tests
        working-directory: axiom
        run: python -m pytest -q tests/axiom2/test_nautilus_smoke_contract.py

      - name: Run actual public-interface smoke harness
        working-directory: axiom
        env:
          NAUTILUS_SOURCE_REVISION: 4f021bafc2e99c5490cee204b0fc2bd2c83baab4
          NAUTILUS_BUILD_MODE: source checkout plus upstream make build
        run: ../nautilus/python/.venv/bin/python scripts/axiom2_nautilus_smoke.py

      - name: Run Nautilus-backed Axiom runtime tests
        working-directory: axiom
        run: PYTHONPATH="$GITHUB_WORKSPACE/axiom" ../nautilus/python/.venv/bin/python -m pytest -q tests/axiom2/nautilus_runtime/test_runtime_recovery.py
