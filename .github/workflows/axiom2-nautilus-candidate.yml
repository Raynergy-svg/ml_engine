name: Axiom 2.0 Nautilus candidate monitor

on:
  push:
    branches:
      - codex/axiom2-nautilus-runtime-2026-10-06
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-monitor-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Axiom branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: axiom

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check "pytest==8.3.5"

      - name: Run durable candidate-monitor tests
        working-directory: axiom
        run: python -m pytest -q tests/axiom2/nautilus_runtime/test_candidate_monitor.py
