name: Code Quality

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Flake8 Linting
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8==7.3.0
        
    - name: Run Flake8
      run: |
        # Run flake8 on src directory
        python -m flake8 src/ --config=.flake8 --statistics
        
    - name: Generate report
      if: failure()
      run: |
        echo "::error::Flake8 linting failed. Please fix the issues before merging."
        python -m flake8 src/ --config=.flake8 --count
        
  syntax-check:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Check Python syntax
      run: |
        # Compile all Python files to check for syntax errors
        python -m compileall src/ -q
        
    - name: Report
      if: success()
      run: |
        echo "✅ All Python files have valid syntax"
