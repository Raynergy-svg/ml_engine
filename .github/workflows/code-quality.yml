name: Code Quality

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Run gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Flake8 Linting
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8==7.3.0
        
    - name: Run Flake8
      run: |
        # Run flake8 on src directory
        python -m flake8 src/ --config=.flake8 --statistics
        
    - name: Generate report
      if: failure()
      run: |
        echo "::error::Flake8 linting failed. Please fix the issues before merging."
        python -m flake8 src/ --config=.flake8 --count
        
  syntax-check:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Check Python syntax
      run: |
        # Compile all Python files to check for syntax errors
        python -m compileall src/ -q
        
    - name: Report
      if: success()
      run: |
        echo "✅ All Python files have valid syntax"

  test:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # pytest itself + pytest-asyncio for async test support.
        # httpretty is imported by tests/conftest.py:27 (oanda_mock fixture)
        # which pytest evaluates during fixture collection across the entire
        # tests/ tree — even though only e2e/ tests actually use the fixture.
        # Without it, `pytest tests/ -x` errors at fixture-setup and bails.
        pip install pytest pytest-asyncio pytest-timeout httpretty

    - name: Run integration tests
      # Curated test list — same set used by the (green) Coverage workflow.
      # The full tests/ tree has ~10+ pre-existing stale tests on main
      # (response-text drift, timeout-constant drift, no-LLM-policy gates,
      # Claude-subprocess fixtures expecting deprecated APIs). Restoring the
      # full `pytest tests/` is a scoped cleanup PR — not CI-infra work.
      # Expand this list as stale tests get repaired.
      run: |
        python -m pytest \
          tests/test_dynamic_sl_tp.py \
          tests/test_dynamic_drawdown.py \
          tests/test_entropy_sizer.py \
          tests/test_kelly_portfolio.py \
          tests/test_model_bandit.py \
          tests/test_model_calibration.py \
          tests/test_agent_lifecycle.py \
          tests/test_affinity_portfolio.py \
          tests/test_audit_20260512.py \
          tests/test_weights_history.py \
          tests/test_agent_vote_index.py \
          tests/test_phase93_mean_reversion_veto.py \
          tests/test_training_infrastructure.py \
          tests/test_generate_policy_input.py \
          tests/integration/test_autonomy_loop_e2e.py \
          -v --tb=short -m "not slow and not integration" 2>&1

    - name: Report
      if: failure()
      run: |
        echo "::error::Integration tests failed. Check test output for details."

  import-validation:
    name: Import Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install core dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pandas rich PyYAML structlog

    - name: Validate critical imports
      run: |
        python -c "from src.utils import setup_logging; print('src.utils OK')"
        python -c "from src.rl.utils import compute_rl_features; print('src.rl.utils OK')"
        python -c "from src.rl.curriculum import CurriculumScheduler; print('src.rl.curriculum OK')"
        python -c "from online_retrainer import OnlineRetrainer, RetrainConfig; print('online_retrainer OK')"
        python -c "from news_features import fetch_forex_news, check_economic_calendar; print('news_features OK')"
        echo "✅ All critical imports validated"

  p0-safety-gates:
    name: P0 Safety Gates (orphan-keys, py_compile, circuit-breaker)
    runs-on: ubuntu-latest
    # Single source of truth: invokes the same hooks developers run locally
    # via pre-commit. Keeping one source of truth avoids CI/local drift.

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # pre-commit drives the three hooks below.
        # requirements.txt installs the full src/ runtime so the circuit-breaker
        # regression tests can import everything they touch.
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pre-commit pytest pytest-asyncio

    - name: Run P0 safety gates (pre-commit, all files)
      run: |
        # pre-commit 4.x only accepts ONE hook ID per invocation — passing
        # multiple makes it exit 2 with "unrecognized arguments". Run each
        # hook separately and fail the step if any returns non-zero.
        set -e
        pre-commit run --all-files --hook-stage manual config-adjustments-orphans
        pre-commit run --all-files --hook-stage manual p0-py-compile
        pre-commit run --all-files --hook-stage manual circuit-breaker-regression

    - name: Report
      if: failure()
      run: |
        echo "::error::P0 safety gate violation. Check pre-commit output above."
        echo "Gate 1 (orphan-keys): blocks on ScannerConfig drift (exit 1 or 2)."
        echo "Gate 2 (py_compile):  blocks on syntax errors in the 5 safety files."
        echo "Gate 3 (circuit-breaker): blocks on regression in trade-blocking gates."

  policy:
    name: Policy-as-Code Promotion Gates (OPA/Conftest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # CI-only governance: evaluates this PR's diff against .ci/policy/rego.
    # Never touches runtime/trading/execution/halt/config — see .ci/policy/README.md.

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Install conftest (pinned, checksum-verified)
      env:
        CONFTEST_VERSION: "0.68.2"
        CONFTEST_SHA256: "e8144c6d6d2ae0260b869caa60c7c262a1f95ac63ec1e5d2fb19be452d606347"
      run: |
        set -euo pipefail
        cd /tmp
        curl -sSLO "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
        echo "${CONFTEST_SHA256}  conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" | sha256sum -c -
        tar xzf "conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" conftest
        sudo mv conftest /usr/local/bin/conftest
        conftest --version

    - name: Rego unit tests (conftest verify)
      run: conftest verify --policy .ci/policy/rego

    - name: Policy fixture acceptance tests (reject + allow per rule)
      run: .ci/policy/run_fixture_tests.sh

    - name: Determine diff range
      id: diff_range
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PUSH_BEFORE_SHA: ${{ github.event.before }}
        PUSH_HEAD_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        if [ "${EVENT_NAME}" = "pull_request" ]; then
          BASE_SHA="${PR_BASE_SHA}"
          HEAD_SHA="${PR_HEAD_SHA}"
        else
          HEAD_SHA="${PUSH_HEAD_SHA}"
          if [ -z "${PUSH_BEFORE_SHA}" ] || [ "${PUSH_BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            # No usable "before" SHA (e.g. first push of a new branch).
            # Fall back to the main merge-base, then the parent commit — but
            # never silently fall back to HEAD itself: that would produce a
            # zero-file diff and a spurious all-green policy run instead of
            # a loud failure.
            BASE_SHA="$(git merge-base origin/main HEAD 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || true)"
            if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "${HEAD_SHA}" ]; then
              echo "::error::Could not resolve a usable base ref for the policy diff (no origin/main merge-base, no parent commit). Refusing to silently evaluate a zero-file diff."
              exit 1
            fi
          else
            BASE_SHA="${PUSH_BEFORE_SHA}"
          fi
        fi
        if [ "${BASE_SHA}" = "${HEAD_SHA}" ]; then
          echo "::error::Resolved base_sha equals head_sha (${HEAD_SHA}) — refusing to silently evaluate a zero-file diff."
          exit 1
        fi
        echo "base_sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"
        echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

    - name: Generate PR-context policy input
      env:
        POLICY_BASE_REF: ${{ steps.diff_range.outputs.base_sha }}
        POLICY_HEAD_REF: ${{ steps.diff_range.outputs.head_sha }}
        POLICY_PR_NUMBER: ${{ github.event.pull_request.number }}
        POLICY_PR_LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}
      run: python3 scripts/ci/generate_policy_input.py --output policy_input.json

    - name: Evaluate promotion-gate policies against this PR
      run: conftest test --all-namespaces --policy .ci/policy/rego policy_input.json

    - name: Report
      if: failure()
      run: |
        echo "::error::Policy-as-code gate failed. See the FAIL lines above for which rule fired and why."
        echo "Generated policy input (for debugging):"
        cat policy_input.json || true
        echo "Rules + evidence conventions: .ci/policy/README.md"
