name: Code Quality

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Flake8 Linting
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8==7.3.0
        
    - name: Run Flake8
      run: |
        # Run flake8 on src directory
        python -m flake8 src/ --config=.flake8 --statistics
        
    - name: Generate report
      if: failure()
      run: |
        echo "::error::Flake8 linting failed. Please fix the issues before merging."
        python -m flake8 src/ --config=.flake8 --count
        
  syntax-check:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Check Python syntax
      run: |
        # Compile all Python files to check for syntax errors
        python -m compileall src/ -q
        
    - name: Report
      if: success()
      run: |
        echo "✅ All Python files have valid syntax"

  test:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest numpy pandas rich PyYAML structlog scikit-learn joblib

    - name: Run integration tests
      run: |
        python -m pytest tests/ -v --tb=short -x 2>&1

    - name: Report
      if: failure()
      run: |
        echo "::error::Integration tests failed. Check test output for details."

  import-validation:
    name: Import Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install core dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pandas rich PyYAML structlog

    - name: Validate critical imports
      run: |
        python -c "from src.utils import setup_logging; print('src.utils OK')"
        python -c "from src.rl.utils import compute_rl_features; print('src.rl.utils OK')"
        python -c "from src.rl.curriculum import CurriculumScheduler; print('src.rl.curriculum OK')"
        python -c "from online_retrainer import OnlineRetrainer, RetrainConfig; print('online_retrainer OK')"
        python -c "from news_features import fetch_forex_news, check_economic_calendar; print('news_features OK')"
        echo "✅ All critical imports validated"

  p0-safety-gates:
    name: P0 Safety Gates (orphan-keys, py_compile, circuit-breaker)
    runs-on: ubuntu-latest
    # Single source of truth: invokes the same hooks developers run locally
    # via pre-commit. Keeping one source of truth avoids CI/local drift.

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # pre-commit drives the three hooks below.
        # pytest + numpy/pandas/... are required by the circuit-breaker
        # regression tests (same set used in the `test` job above).
        pip install pre-commit pytest numpy pandas rich PyYAML structlog scikit-learn

    - name: Run P0 safety gates (pre-commit, all files)
      run: |
        pre-commit run --all-files \
          --hook-stage manual \
          config-adjustments-orphans \
          p0-py-compile \
          circuit-breaker-regression

    - name: Report
      if: failure()
      run: |
        echo "::error::P0 safety gate violation. Check pre-commit output above."
        echo "Gate 1 (orphan-keys): blocks on ScannerConfig drift (exit 1 or 2)."
        echo "Gate 2 (py_compile):  blocks on syntax errors in the 5 safety files."
        echo "Gate 3 (circuit-breaker): blocks on regression in trade-blocking gates."
