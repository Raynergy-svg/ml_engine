name: Axiom Research Boundary

on:
  pull_request:
  push:
    branches: [main, 'codex/axiom-2*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-contracts:
    name: Research isolation and contracts (Tasks 1-5)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-09-30
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, verified 2026-09-30
        with:
          python-version: '3.11'
      - name: Install the pinned research-evidence dependencies
        run: python -m pip install -r requirements-axiom2-research.txt
      - name: Run every current Axiom contract and boundary test
        run: python -m pytest tests/axiom2 tests/evidence/equity_research tests/test_evidence_contracts.py tests/test_evidence_store.py tests/test_equity_research_evidence_slice.py tests/test_equity_research_evidence_worker_no_authority.py -q --junitxml="$RUNNER_TEMP/axiom-research-tests.xml"
      - name: Build and prove the execution-free research artifact
        run: |
          python scripts/axiom2_verify_isolation.py --bundle "$RUNNER_TEMP/axiom-research-contracts.zip" > "$RUNNER_TEMP/axiom-research-boundary.json"
          cat "$RUNNER_TEMP/axiom-research-boundary.json"
      - name: Verify source checkout remains unchanged
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
