; Runs BOTH bot loops in one container, each auto-restarted on exit (KeepAlive-style).
; The loops re-read .claude/state.json halt + the practice pin EVERY cycle — supervisor
; restart is process resilience, NOT a halt/practice bypass.
[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
user=root

[program:trend]
command=python scripts/run_oanda_trend.py --loop 3600
directory=/app
autostart=true
autorestart=true
startretries=1000000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0

[program:tier7]
command=python scripts/run_tier7_loop.py
directory=/app
autostart=true
autorestart=true
startretries=1000000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0
